<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Settings • Viewora</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>

<!-- Header -->
<header class="settings-header">
    <button class="back-btn" type="button" onclick="goBack()" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </button>
    <h1>Settings</h1>
</header>

<main class="settings-main">

    <!-- Profile Card -->
    <section class="profile-card" onclick="openPage('account-settings.html')">
        <img id="profilePhoto" src="non.jpg" alt="Profile" class="profile-avatar" onerror="this.src='non.jpg'">
        <div class="profile-meta">
            <h2 id="profileName">Loading...</h2>
            <p id="profileUsername">@user</p>
        </div>
        <span class="chevron">›</span>
    </section>

    <!-- Account -->
    <section class="settings-group">
        <h3 class="group-title">Account</h3>
        <div class="group-list">
            <button class="row" type="button" onclick="openPage('account-settings.html')">
                <span class="row-icon">👤</span>
                <span class="row-text">
                    <strong>Account information</strong>
                    <small>Name, username, email</small>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="openPage('security-settings.html')">
                <span class="row-icon">🔐</span>
                <span class="row-text">
                    <strong>Security</strong>
                    <small>Password & login activity</small>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="openPage('privacy.html')">
                <span class="row-icon">🛡️</span>
                <span class="row-text">
                    <strong>Privacy</strong>
                    <small>Who can see your content</small>
                </span>
                <span class="chevron">›</span>
            </button>
        </div>
    </section>

    <!-- Creator tools (YouTube / Instagram style) -->
    <section class="settings-group">
        <h3 class="group-title">Creator tools</h3>
        <div class="group-list">
            <button class="row" type="button" onclick="openPage('monetization.html')">
                <span class="row-icon">💰</span>
                <span class="row-text">
                    <strong>Monetization</strong>
                    <small>Eligibility, balance & $50 payouts</small>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="openPage('monetization.html')">
                <span class="row-icon">📊</span>
                <span class="row-text">
                    <strong>Earnings</strong>
                    <small>Balance, history & payout method</small>
                </span>
                <span class="chevron">›</span>
            </button>
        </div>
    </section>

    <!-- Preferences -->
    <section class="settings-group">
        <h3 class="group-title">Preferences</h3>
        <div class="group-list">
            <button class="row" type="button" onclick="openPage('appearance-settings.html')">
                <span class="row-icon">🎨</span>
                <span class="row-text">
                    <strong>Appearance</strong>
                    <small>Theme & display</small>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="openPage('notification-settings.html')">
                <span class="row-icon">🔔</span>
                <span class="row-text">
                    <strong>Notifications</strong>
                    <small>Likes, comments, stories</small>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="changeLanguage()">
                <span class="row-icon">🌐</span>
                <span class="row-text">
                    <strong>Language</strong>
                    <small>English</small>
                </span>
                <span class="chevron">›</span>
            </button>
        </div>
    </section>

    <!-- More -->
    <section class="settings-group">
        <h3 class="group-title">More</h3>
        <div class="group-list">
            <button class="row" type="button" onclick="shareApp()">
                <span class="row-icon">📤</span>
                <span class="row-text">
                    <strong>Share Viewora</strong>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="clearCache()">
                <span class="row-icon">🧹</span>
                <span class="row-text">
                    <strong>Clear cache</strong>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="showHelp()">
                <span class="row-icon">❓</span>
                <span class="row-text">
                    <strong>Help & support</strong>
                </span>
                <span class="chevron">›</span>
            </button>
            <button class="row" type="button" onclick="showAbout()">
                <span class="row-icon">ℹ️</span>
                <span class="row-text">
                    <strong>About Viewora</strong>
                </span>
                <span class="chevron">›</span>
            </button>
        </div>
    </section>

    <!-- Account actions -->
    <section class="settings-group">
        <div class="group-list">
            <button class="row logout-row" type="button" onclick="logout()">
                <span class="row-icon">🚪</span>
                <span class="row-text">
                    <strong>Log out</strong>
                </span>
            </button>
            <button class="row delete-row" type="button" onclick="deleteAccount()">
                <span class="row-icon">🗑️</span>
                <span class="row-text">
                    <strong>Delete account</strong>
                </span>
            </button>
        </div>
    </section>

    <p class="version-text">Viewora · Version 1.0.0</p>

</main>

<!-- Toast -->
<div id="vieworaToast" class="toast" aria-live="polite">
    <span id="toastIcon">✓</span>
    <span id="toastMessage">Done</span>
</div>

<!-- Loader -->
<div id="settingsLoader" class="loader-overlay">
    <div class="spinner"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="settings.js"></script>

</body>
</html>
