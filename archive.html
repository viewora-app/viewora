<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Viewora · Archive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="index.css"/>
<style>
body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0a0a0f;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.back{border:0;background:rgba(255,255,255,.08);width:40px;height:40px;border-radius:50%;color:#fff}
.list{padding:12px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:#141418;border-radius:14px;padding:10px;align-items:center}
.card img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:#222}
.card .meta{flex:1;min-width:0}
.card strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:12px;color:#9ca3af}
.card button{border:0;background:rgba(255,255,255,.1);color:#fff;padding:8px 12px;border-radius:10px;font-size:12px}
.empty{text-align:center;padding:48px 16px;color:#9ca3af}
</style>
</head>
<body>
<div class="top">
  <button class="back" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i></button>
  <h1>Archive</h1>
</div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
(function(){
  document.getElementById("backBtn").onclick=function(){ history.length>1?history.back():location.href="profile.html"; };
  function ready(cb){ if(window.firebase&&firebase.apps.length) cb(); else setTimeout(function(){ready(cb)},50); }
  ready(function(){
    firebase.auth().onAuthStateChanged(async function(u){
      var list=document.getElementById("list");
      if(!u){ list.innerHTML='<div class="empty">Login required</div>'; return; }
      var db=firebase.database();
      var items=[];
      try{
        var snap=await db.ref("videos").orderByChild("uid").equalTo(u.uid).once("value");
        snap.forEach(function(c){ var d=c.val()||{}; if(d.archived===true||d.hidden===true) items.push({id:c.key,type:"video",d:d}); });
      }catch(_){}
      try{
        var ss=await db.ref("shorts").orderByChild("uid").equalTo(u.uid).once("value");
        ss.forEach(function(c){ var d=c.val()||{}; if(d.archived===true||d.hidden===true) items.push({id:c.key,type:"short",d:d}); });
      }catch(_){}
      items.sort(function(a,b){ return (b.d.archivedAt||b.d.updatedAt||0)-(a.d.archivedAt||a.d.updatedAt||0); });
      if(!items.length){ list.innerHTML='<div class="empty"><i class="fa-solid fa-box-archive" style="font-size:36px;opacity:.4"></i><p>No archived items</p></div>'; return; }
      list.innerHTML=items.map(function(it){
        var d=it.d; var thumb=d.thumbnail||d.thumbnailUrl||d.cover||"";
        var title=d.title||d.caption||"Untitled";
        return '<div class="card" data-id="'+it.id+'" data-type="'+it.type+'">'+
          (thumb?'<img src="'+thumb+'" alt="">':'<div style="width:72px;height:72px;border-radius:10px;background:#222;display:grid;place-items:center"><i class="fa-solid fa-film"></i></div>')+
          '<div class="meta"><strong>'+title.replace(/</g,"")+'</strong><span>'+it.type+' · archived</span></div>'+
          '<button type="button" data-restore="1">Restore</button></div>';
      }).join("");
      list.querySelectorAll("[data-restore]").forEach(function(btn){
        btn.onclick=async function(){
          var card=btn.closest(".card"); var id=card.dataset.id; var type=card.dataset.type;
          var path=type==="short"?"shorts/"+id:"videos/"+id;
          await db.ref(path).update({archived:false,hidden:false,archivedAt:null});
          card.remove();
        };
      });
    });
  });
})();
</script>
</body>
</html>
