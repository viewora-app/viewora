<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080d">
<title>Viewora · Saved</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0a0a0f;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.back{border:0;background:rgba(255,255,255,.08);width:40px;height:40px;border-radius:50%;color:#fff}
.tabs{display:flex;gap:8px;padding:10px 12px;overflow:auto}
.tabs button{border:0;background:rgba(255,255,255,.08);color:#ccc;padding:8px 14px;border-radius:999px;font-weight:600;white-space:nowrap}
.tabs button.active{background:#7c3aed;color:#fff}
.list{padding:8px 12px 80px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:#12121a;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;text-decoration:none;color:#fff}
.card img{width:88px;height:88px;object-fit:cover;flex-shrink:0;background:#1a1a24}
.card .meta{padding:10px 10px 10px 0;min-width:0;flex:1}
.card .meta strong{display:block;font-size:13px}
.card .meta span{display:block;font-size:12px;color:#9b9ba8;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta small{display:block;font-size:11px;color:#7c7c8a;margin-top:6px}
.empty{text-align:center;padding:48px 16px;color:#9ca3af}
</style>
</head>
<body>
<div class="top">
  <button class="back" id="backBtn" type="button"><i class="fa-solid fa-arrow-left"></i></button>
  <h1>Saved</h1>
</div>
<div class="tabs">
  <button type="button" class="active" data-tab="all">All</button>
  <button type="button" data-tab="posts">Posts</button>
  <button type="button" data-tab="shorts">Shorts</button>
  <button type="button" data-tab="videos">Videos</button>
</div>
<div class="list" id="grid"><div class="empty">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
(function(){
  var tab="all";
  var cache={posts:[],shorts:[],videos:[]};
  var grid=document.getElementById("grid");
  document.getElementById("backBtn").onclick=function(){
    if(history.length>1)history.back(); else location.href="profile.html";
  };
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("active")});
      b.classList.add("active"); tab=b.getAttribute("data-tab"); paint();
    };
  });
  function dateStr(ts){
    ts=Number(ts)||0; if(!ts) return "";
    return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
  }
  function paint(){
    var items=[];
    if(tab==="all"||tab==="posts") items=items.concat(cache.posts.map(function(x){return Object.assign({_t:"post"},x)}));
    if(tab==="all"||tab==="shorts") items=items.concat(cache.shorts.map(function(x){return Object.assign({_t:"short"},x)}));
    if(tab==="all"||tab==="videos") items=items.concat(cache.videos.map(function(x){return Object.assign({_t:"video"},x)}));
    items.sort(function(a,b){return (Number(b.savedAt)||0)-(Number(a.savedAt)||0)});
    if(!items.length){
      grid.innerHTML='<div class="empty"><i class="fa-regular fa-bookmark" style="font-size:36px;opacity:.4"></i><p>No saved items</p><p style="font-size:13px">Only content you save will show here.</p></div>';
      return;
    }
    grid.innerHTML=items.map(function(it){
      var thumb=it.thumbnail||it.thumbnailUrl||it.cover||it.thumb||"";
      var href=it._t==="short"?("shorts.html?id="+encodeURIComponent(it.id)):
               it._t==="video"?("video.html?id="+encodeURIComponent(it.id)):
               ("post.html?id="+encodeURIComponent(it.id));
      var label=it._t==="short"?"Short":it._t==="video"?"Video":"Post";
      var cap=(it.caption||it.title||it.text||"").toString().slice(0,80);
      var d=dateStr(it.savedAt);
      return '<a class="card" href="'+href+'">'+(thumb?'<img src="'+thumb.replace(/"/g,"")+'" alt="">':'<img alt="">')+
        '<div class="meta"><strong>'+label+'</strong><span>'+cap.replace(/</g,"&lt;")+'</span>'+
        (d?'<small>Saved · '+d+'</small>':'')+'</div></a>';
    }).join("");
  }
  function loadMap(path, type){
    return firebase.database().ref(path).once("value").then(function(s){
      var v=s.val()||{};
      return Object.keys(v).map(function(id){
        var row=v[id]||{};
        return Object.assign({id:id,savedAt:row.savedAt||row.createdAt||0}, row);
      });
    }).catch(function(){ return []; });
  }
  function ready(cb){ if(window.firebase&&firebase.apps.length) cb(); else setTimeout(function(){ready(cb)},50); }
  ready(function(){
    firebase.auth().onAuthStateChanged(async function(u){
      if(!u){ grid.innerHTML='<div class="empty">Login required</div>'; return; }
      var uid=u.uid;
      cache.posts=await loadMap("savedPosts/"+uid,"post");
      cache.shorts=await loadMap("savedShorts/"+uid,"short");
      cache.videos=await loadMap("savedVideos/"+uid,"video");
      // only this user's nodes — no global feed mix
      paint();
    });
  });
})();
</script>
</body>
</html>
