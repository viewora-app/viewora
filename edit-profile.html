<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>Edit Profile • Viewora</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="edit-profile.css">
<script>
(function(){try{var t=localStorage.getItem("viewora_theme")||"dark";document.documentElement.setAttribute("data-theme",t==="system"?(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"):t);}catch(e){}})();
</script>
</head>
<body>
  <header class="topBar">
    <button type="button" class="back" id="backBtn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <h1>Edit Profile</h1>
    <button type="button" class="saveBtn" id="saveBtn">Save</button>
  </header>

  <main class="wrap">
    <!-- Banner + Avatar -->
    <div class="bannerSection">
      <div class="bannerWrap" id="bannerWrap">
        <img id="bannerImg" src="assets/default-banner.jpg" alt="" onerror="this.style.opacity='0.3'">
        <button type="button" class="bannerCam" id="bannerCam" aria-label="Change banner">
          <i class="fa-solid fa-camera"></i>
          <span>Change banner</span>
        </button>
      </div>
      <div class="avatarSection">
        <div class="avatarWrap" id="avatarWrap">
          <img id="avatarImg" src="assets/default-avatar.png" alt="" onerror="this.style.display='none';document.getElementById('avatarFb').style.display='grid'">
          <div class="avatarFb" id="avatarFb" style="display:none">V</div>
          <button type="button" class="avatarCam" id="avatarCam" aria-label="Change photo">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
        <button type="button" class="changePhotoBtn" id="changePhotoBtn">Change profile photo</button>
      </div>
      <input type="file" id="avatarInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="bannerInput" accept="image/*" hidden>
    </div>

    <!-- Name / Username / Bio -->
    <section class="card">
      <label class="field">
        <span class="lab">Name</span>
        <input type="text" id="nameInput" maxlength="50" placeholder="Your name" autocomplete="name">
      </label>
      <label class="field">
        <span class="lab">Username</span>
        <div class="inputWithPrefix">
          <span class="prefix">@</span>
          <input type="text" id="usernameInput" maxlength="30" placeholder="username" autocomplete="username" spellcheck="false">
        </div>
        <span class="hint" id="usernameHint">Letters, numbers, underscores · 3–30</span>
      </label>
      <label class="field">
        <span class="lab">Bio</span>
        <textarea id="bioInput" maxlength="150" rows="3" placeholder="Tell people about yourself"></textarea>
        <span class="hint"><span id="bioCount">0</span>/150</span>
      </label>
    </section>

    <!-- Country (auto IP) -->
    <section class="card">
      <div class="field">
        <span class="lab">Country</span>
        <div class="countryRow">
          <i class="fa-solid fa-location-dot"></i>
          <span id="countryLabel">Detecting…</span>
        </div>
        <span class="hint">Auto from your IP — where your account is used from</span>
      </div>
    </section>

    <!-- Social links -->
    <section class="card links">
      <div class="sectionTitle">Social links</div>
      <p class="sectionDesc">Add username or profile URL. Icons show on your profile.</p>

      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-instagram" style="color:#E1306C"></i> Instagram</span>
        <input type="text" id="social_instagram" maxlength="120" placeholder="@username or profile URL" autocomplete="off" spellcheck="false">
      </label>
      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-facebook" style="color:#1877F2"></i> Facebook</span>
        <input type="text" id="social_facebook" maxlength="120" placeholder="username or profile URL" autocomplete="off" spellcheck="false">
      </label>
      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-x-twitter" style="color:#fff"></i> X (Twitter)</span>
        <input type="text" id="social_x" maxlength="120" placeholder="@username or profile URL" autocomplete="off" spellcheck="false">
      </label>
      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-youtube" style="color:#FF0000"></i> YouTube</span>
        <input type="text" id="social_youtube" maxlength="120" placeholder="@channel or channel URL" autocomplete="off" spellcheck="false">
      </label>
      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-linkedin" style="color:#0A66C2"></i> LinkedIn</span>
        <input type="text" id="social_linkedin" maxlength="120" placeholder="username or profile URL" autocomplete="off" spellcheck="false">
      </label>
      <label class="field socialField">
        <span class="lab socialLab"><i class="fa-brands fa-pinterest" style="color:#E60023"></i> Pinterest</span>
        <input type="text" id="social_pinterest" maxlength="120" placeholder="username or profile URL" autocomplete="off" spellcheck="false">
      </label>
    </section>

    <!-- Custom website -->
    <section class="card">
      <label class="field">
        <span class="lab"><i class="fa-solid fa-link"></i> Website / custom link</span>
        <input type="url" id="websiteInput" maxlength="160" placeholder="https://your-site.com" autocomplete="url">
        <span class="hint">Optional — shows as blue link on profile</span>
      </label>
    </section>

    <p class="footerNote">Changes save to your public profile. Username must be unique.</p>
  </main>

  <div class="toast" id="toast"></div>
  <div class="loadingMask" id="loadingMask" hidden>
    <div class="spinner"></div>
    <span>Saving…</span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="theme.js"></script>
  <script src="edit-profile.js"></script>
</body>
</html>
