<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Viewora • Profile</title>

    <meta
        name="theme-color"
        content="#070912"
    >

    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- =====================================================
         PROFILE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="profile.css"
    >

    <link
        rel="stylesheet"
        href="nav.css"
    >
     
<link rel="stylesheet" href="viewora-loader.css">

    <style>

        /* =====================================================
           VIEWORA PREMIUM PROFILE
        ====================================================== */

        :root {

            --bg:
                #06070c;

            --card:
                rgba(255,255,255,.055);

            --card-border:
                rgba(255,255,255,.09);

            --text:
                #ffffff;

            --muted:
                #9da3b4;

            --accent:
                #6c63ff;

            --accent2:
                #00d9ff;

            --shadow:
                0 25px 70px rgba(0,0,0,.45);
        }


        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family:
                "Inter",
                sans-serif;

            -webkit-tap-highlight-color:
                transparent;
        }


        html {

            scroll-behavior:
                smooth;
        }


        body {

            min-height: 100vh;

            background:
                var(--bg);

            color:
                var(--text);

            overflow-x:
                hidden;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ====================================================== */

        .premiumBackground {

            position: fixed;

            inset: 0;

            z-index: -5;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(108,99,255,.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(0,217,255,.10),
                    transparent 28%
                ),
                #06070c;
        }


        .orb {

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter:
                blur(80px);

            opacity: .35;

            animation:
                floatingOrb 10s ease-in-out infinite;
        }


        .orbOne {

            top: 5%;
            left: -80px;

            background:
                #655cff;
        }


        .orbTwo {

            right: -90px;
            top: 35%;

            background:
                #00d9ff;

            animation-delay:
                -3s;
        }


        .orbThree {

            bottom: -100px;
            left: 35%;

            background:
                #9b59ff;

            animation-delay:
                -6s;
        }


        @keyframes floatingOrb {

            0%,
            100% {

                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            50% {

                transform:
                    translate3d(35px,-45px,0)
                    scale(1.12);
            }
        }


        /* =====================================================
           LOADER
        ====================================================== */

        #pageLoader {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap: 18px;

            background:
                #06070c;

            transition:
                opacity .45s ease,
                visibility .45s ease;
        }


        #pageLoader.hidden {

            opacity: 0;

            visibility:
                hidden;

            pointer-events:
                none;
        }


        .loader {

            position:
                relative;

            width: 65px;
            height: 65px;
        }


        .ring {

            position: absolute;

            inset: 0;

            border-radius:
                50%;

            border:
                3px solid
                rgba(255,255,255,.08);

            border-top-color:
                var(--accent);

            border-right-color:
                var(--accent2);

            animation:
                loaderSpin 1s linear infinite;
        }


        .ring.delay {

            inset: 9px;

            border:
                2px solid
                rgba(255,255,255,.06);

            border-bottom-color:
                #fff;

            animation-direction:
                reverse;

            animation-duration:
                1.6s;
        }


        @keyframes loaderSpin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        #pageLoader h2 {

            font-size:
                14px;

            font-weight:
                600;

            color:
                #aeb4c5;

            letter-spacing:
                .4px;
        }


        /* =====================================================
           APP
        ====================================================== */

        #app {

            width:
                100%;

            max-width:
                760px;

            min-height:
                100vh;

            margin:
                auto;

            padding-bottom:
                100px;

            animation:
                pageEnter .7s ease both;
        }


        #app.hidden {

            display:
                none;
        }


        @keyframes pageEnter {

            from {

                opacity: 0;

                transform:
                    translateY(18px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           COVER
        ====================================================== */

        .profileBanner {

            position:
                relative;

            height:
                245px;

            overflow:
                hidden;

            border-radius:
                0 0 34px 34px;

            background:
                #111;
        }


        #coverPhoto {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            transform:
                scale(1.04);

            animation:
                coverReveal 1.3s ease both;
        }


        @keyframes coverReveal {

            from {

                opacity: 0;

                transform:
                    scale(1.12);
            }

            to {

                opacity: 1;

                transform:
                    scale(1.04);
            }
        }


        .bannerOverlay {

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.18),
                    transparent 35%,
                    rgba(6,7,12,.95)
                );
        }


        .profileBanner::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    110deg,
                    transparent 25%,
                    rgba(255,255,255,.10) 50%,
                    transparent 75%
                );

            transform:
                translateX(-120%);

            animation:
                coverShine 5s ease-in-out infinite;
        }


        @keyframes coverShine {

            0%,
            55% {

                transform:
                    translateX(-120%);
            }

            75%,
            100% {

                transform:
                    translateX(120%);
            }
        }


        /* =====================================================
           TOP BUTTONS
        ====================================================== */

        .shareBtn,
        .settingsBtn {

            position:
                absolute;

            top:
                18px;

            z-index:
                5;

            width:
                43px;

            height:
                43px;

            border:
                1px solid
                rgba(255,255,255,.14);

            border-radius:
                15px;

            color:
                #fff;

            background:
                rgba(10,12,20,.48);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            cursor:
                pointer;

            transition:
                .25s ease;
        }


        .shareBtn {

            right:
                68px;
        }


        .settingsBtn {

            right:
                18px;
        }


        .shareBtn:hover,
        .settingsBtn:hover {

            transform:
                translateY(-3px)
                scale(1.04);

            background:
                rgba(108,99,255,.45);
        }


        /* =====================================================
           PROFILE CARD
        ====================================================== */

        .profileCard {

            position:
                relative;

            margin:
                -58px 14px 0;

            padding:
                0 20px 24px;

            text-align:
                center;

            z-index:
                10;

            border:
                1px solid
                var(--card-border);

            border-radius:
                30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            animation:
                cardRise .8s .15s ease both;
        }


        @keyframes cardRise {

            from {

                opacity: 0;

                transform:
                    translateY(35px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           AVATAR
        ====================================================== */

        #storyRing {

            position:
                relative;

            width:
                112px;

            height:
                112px;

            margin:
                -56px auto 14px;

            padding:
                4px;

            border-radius:
                50%;

            background:
                conic-gradient(
                    from 0deg,
                    #6c63ff,
                    #00d9ff,
                    #ff4fd8,
                    #6c63ff
                );

            animation:
                avatarGradient 5s linear infinite;

            box-shadow:
                0 12px 40px
                rgba(108,99,255,.35);
        }


        @keyframes avatarGradient {

            to {

                transform:
                    rotate(360deg);
            }
        }


        #storyRing img {

            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

            border:
                4px solid
                #090a10;

            border-radius:
                50%;

            animation:
                avatarImageIn .8s ease both;
        }


        @keyframes avatarImageIn {

            from {

                opacity: 0;

                transform:
                    scale(.75);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        .storyPlus {

            position:
                absolute;

            right:
                1px;

            bottom:
                2px;

            width:
                32px;

            height:
                32px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                3px solid
                #090a10;

            border-radius:
                50%;

            background:
                linear-gradient(
                    135deg,
                    #6c63ff,
                    #00d9ff
                );

            color:
                #fff;

            cursor:
                pointer;

            transition:
                .25s ease;
        }


        .storyPlus:hover {

            transform:
                rotate(90deg)
                scale(1.08);
        }


        /* =====================================================
           NAME
        ====================================================== */

        #profileName {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            margin:
                0;

            font-size:
                24px;

            font-weight:
                800;

            letter-spacing:
                -.6px;
        }


        .verified {

            color:
                #20cfff;

            font-size:
                17px;

            animation:
                verifiedPulse 2s ease-in-out infinite;
        }


        .verified.hidden {

            display:
                none;
        }


        @keyframes verifiedPulse {

            50% {

                transform:
                    scale(1.15);
            }
        }


        .username {

            margin-top:
                5px;

            color:
                #8f97aa;

            font-size:
                13px;
        }


        .bio {

            max-width:
                500px;

            margin:
                13px auto 0;

            color:
                #d5d8e2;

            line-height:
                1.55;

            font-size:
                14px;
        }


        /* =====================================================
           META
        ====================================================== */

        .profileMeta {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-wrap:
                wrap;

            gap:
                15px;

            margin-top:
                14px;

            color:
                #858da0;

            font-size:
                11px;
        }


        .profileMeta span {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;
        }


        .profileMeta i {

            color:
                #7c73ff;
        }


        /* =====================================================
           STATS
        ====================================================== */

        .profileStats {

            display:
                grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:
                8px;

            margin-top:
                22px;
        }


        .stat {

            padding:
                13px 5px;

            border:
                1px solid
                rgba(255,255,255,.065);

            border-radius:
                17px;

            background:
                rgba(255,255,255,.035);

            transition:
                .3s ease;
        }


        .stat:hover {

            transform:
                translateY(-4px);

            background:
                rgba(108,99,255,.10);

            border-color:
                rgba(108,99,255,.25);
        }


        .stat h2 {

            font-size:
                18px;

            font-weight:
                800;
        }


        .stat span {

            display:
                block;

            margin-top:
                3px;

            color:
                #8b92a4;

            font-size:
                10px;
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .profileButtons {

            display:
                grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap:
                9px;

            margin-top:
                18px;
        }


        .profileButtons button,
        .profileButtons a {

            min-height:
                44px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius:
                14px;

            color:
                #fff;

            text-decoration:
                none;

            font-size:
                12px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                .25s ease;
        }


        .primaryBtn {

            border:
                0 !important;

            background:
                linear-gradient(
                    135deg,
                    #6c63ff,
                    #00bfe9
                );

            box-shadow:
                0 8px 25px
                rgba(78,110,255,.25);
        }


        .secondaryBtn {

            background:
                rgba(255,255,255,.045);
        }


        .profileButtons button:hover,
        .profileButtons a:hover {

            transform:
                translateY(-3px);
        }


        /* =====================================================
           STORY HIGHLIGHTS
        ====================================================== */

        .storySection {

            margin:
                18px 14px 0;

            padding:
                18px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius:
                25px;

            background:
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(18px);

            animation:
                sectionReveal .7s .3s ease both;
        }


        @keyframes sectionReveal {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .storySection h3 {

            margin-bottom:
                15px;

            font-size:
                14px;
        }


        .storiesWrapper {

            display:
                flex;

            gap:
                15px;

            overflow-x:
                auto;

            scrollbar-width:
                none;
        }


        .storiesWrapper::-webkit-scrollbar {

            display:
                none;
        }


        .storyItem {

            min-width:
                66px;

            text-align:
                center;

            cursor:
                pointer;
        }


        .storyCircle {

            width:
                62px;

            height:
                62px;

            padding:
                3px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin:
                auto;

            border-radius:
                50%;

            background:
                conic-gradient(
                    #6c63ff,
                    #00d9ff,
                    #ff4fd8,
                    #6c63ff
                );

            transition:
                .3s ease;
        }


        .storyCircle:hover {

            transform:
                scale(1.08)
                rotate(4deg);
        }


        .storyCircle img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            border:
                3px solid
                #08090f;

            border-radius:
                50%;
        }


        .addStory {

            color:
                #fff;

            font-size:
                18px;

            background:
                linear-gradient(
                    135deg,
                    #181b29,
                    #252a3b
                );

            border:
                1px solid
                rgba(255,255,255,.1);
        }


        .storyItem p {

            margin-top:
                7px;

            color:
                #9aa1b2;

            font-size:
                10px;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        /* =====================================================
           TABS
        ====================================================== */

        .profileTabs {

            position:
                sticky;

            top:
                0;

            z-index:
                30;

            display:
                grid;

            grid-template-columns:
                repeat(4,1fr);

            margin:
                15px 14px 0;

            padding:
                5px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                18px;

            background:
                rgba(8,9,15,.78);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);
        }


        .tabBtn {

            position:
                relative;

            min-height:
                43px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                3px;

            border:
                0;

            border-radius:
                13px;

            background:
                transparent;

            color:
                #737b8f;

            font-size:
                9px;

            cursor:
                pointer;

            transition:
                .25s ease;
        }


        .tabBtn i {

            font-size:
                14px;
        }


        .tabBtn.active {

            color:
                #fff;

            background:
                linear-gradient(
                    135deg,
                    rgba(108,99,255,.24),
                    rgba(0,217,255,.10)
                );
        }


        .tabBtn.active::after {

            content:
                "";

            position:
                absolute;

            left:
                25%;

            right:
                25%;

            bottom:
                2px;

            height:
                2px;

            border-radius:
                10px;

            background:
                linear-gradient(
                    90deg,
                    #6c63ff,
                    #00d9ff
                );
        }


        /* =====================================================
           TAB CONTENT
        ====================================================== */

        .tabContainer {

            margin:
                12px 14px 0;
        }


        .tabContent {

            display:
                none;

            animation:
                tabIn .35s ease both;
        }


        .tabContent.active {

            display:
                block;
        }


        @keyframes tabIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .postsGrid,
        .shortsGrid,
        .savedGrid {

            display:
                grid;

            grid-template-columns:
                repeat(3,1fr);

            gap:
                4px;
        }


        .videosList {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;
        }


        /* =====================================================
           BOTTOM NAV
        ====================================================== */

        .bottomNav {

            position:
                fixed;

            left:
                50%;

            bottom:
                12px;

            transform:
                translateX(-50%);

            z-index:
                1000;

            width:
                min(94%, 600px);

            height:
                64px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-around;

            padding:
                5px 8px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius:
                23px;

            background:
                rgba(10,11,18,.78);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,.45);
        }


        .bottomNav a {

            position:
                relative;

            width:
                58px;

            height:
                54px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                3px;

            color:
                #777f93;

            text-decoration:
                none;

            font-size:
                9px;

            transition:
                .25s ease;
        }


        .bottomNav a i {

            font-size:
                17px;
        }


        .bottomNav a.active {

            color:
                #fff;
        }


        .activeIndicator {

            position:
                absolute;

            top:
                4px;

            width:
                5px;

            height:
                5px;

            border-radius:
                50%;

            background:
                #00d9ff;

            opacity:
                0;

            transform:
                scale(0);

            transition:
                .25s ease;
        }


        .bottomNav a.active .activeIndicator {

            opacity:
                1;

            transform:
                scale(1);
        }


        .uploadNav {

            width:
                48px !important;

            height:
                48px !important;

            border-radius:
                16px !important;

            color:
                #fff !important;

            background:
                linear-gradient(
                    135deg,
                    #6c63ff,
                    #00c9ed
                );

            box-shadow:
                0 8px 25px
                rgba(90,100,255,.35);
        }


        .uploadNav i {

            font-size:
                20px !important;
        }


        /* =====================================================
           SCROLL TOP
        ====================================================== */

        .floatingTop {

            position:
                fixed;

            right:
                18px;

            bottom:
                92px;

            z-index:
                900;

            width:
                42px;

            height:
                42px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius:
                14px;

            background:
                rgba(20,22,32,.8);

            color:
                #fff;

            backdrop-filter:
                blur(15px);

            cursor:
                pointer;

            transition:
                .25s ease;
        }


        .floatingTop.hidden {

            opacity:
                0;

            pointer-events:
                none;

            transform:
                translateY(10px);
        }


        .floatingTop:not(.hidden) {

            animation:
                topButtonIn .3s ease;
        }


        @keyframes topButtonIn {

            from {

                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 520px) {

            #app {

                padding-bottom:
                    92px;
            }


            .profileBanner {

                height:
                    215px;

                border-radius:
                    0 0 28px 28px;
            }


            .profileCard {

                margin-top:
                    -52px;

                padding:
                    0 14px 20px;

                border-radius:
                    26px;
            }


            #storyRing {

                width:
                    104px;

                height:
                    104px;

                margin-top:
                    -52px;
            }


            #profileName {

                font-size:

     PREMIUM PROFILE BOOT
====================================================== -->

<script>

"use strict";


document.addEventListener(
    "DOMContentLoaded",
    () => {

        /*
         * Story button
         */

        const storyBtn =
            document.getElementById(
                "storyPlusBtn"
            );

        const newStory =
            document.getElementById(
                "newStoryItem"
            );

        const storyFile =
            document.getElementById(
                "storyFile"
            );


        function openStoryPicker() {

            if (storyFile) {

                storyFile.click();

            } else if (
                typeof createStory ===
                "function"
            ) {

                createStory();

            }

        }


        storyBtn?.addEventListener(
            "click",
            openStoryPicker
        );


        newStory?.addEventListener(
            "click",
            openStoryPicker
        );


        /*
         * Settings
         */

        document
            .getElementById(
                "settingsBtn"
            )
            ?.addEventListener(
                "click",
                () => {

                    location.href =
                        "settings.html";

                }
            );


        /*
         * Share profile
         */

        document
            .getElementById(
                "shareProfileBtn"
            )
            ?.addEventListener(
                "click",
                async () => {

                    const username =
                        document
                            .getElementById(
                                "profileUsername"
                            )
                            ?.textContent
                            ?.trim();

                    const shareData = {

                        title:
                            "Viewora Profile",

                        text:
                            username
                                ? `Check out ${username} on Viewora`
                                : "Check out this profile on Viewora",

                        url:
                            window.location.href

                    };


                    try {

                        if (
                            navigator.share
                        ) {

                            await navigator.share(
                                shareData
                            );

                        } else if (
                            navigator.clipboard
                        ) {

                            await navigator.clipboard.writeText(
                                window.location.href
                            );

                            alert(
                                "Profile link copied!"
                            );

                        }

                    } catch (error) {

                        if (
                            error?.name !==
                            "AbortError"
                        ) {

                            console.warn(
                                "Share failed:",
                                error
                            );

                        }

                    }

                }
            );


        /*
         * Scroll top
         */

        const topBtn =
            document.getElementById(
                "scrollTopBtn"
            );


        window.addEventListener(
            "scroll",
            () => {

                if (!topBtn) {
                    return;
                }

                topBtn.classList.toggle(
                    "hidden",
                    window.scrollY < 400
                );

            },
            {
                passive: true
            }
        );


        topBtn?.addEventListener(
            "click",
            () => {

                window.scrollTo({

                    top:
                        0,

                    behavior:
                        "smooth"

                });

            }
        );


        /*
         * Premium tab animation
         */

        document
            .querySelectorAll(
                ".tabBtn"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".tabBtn"
                                )
                                .forEach(
                                    btn =>
                                        btn.classList.remove(
                                            "active"
                                        )
                                );

                            button.classList.add(
                                "active"
                            );

                        }
                    );

                }
            );


        /*
         * Loader fallback.
         * profile.js can hide it earlier.
         */

        setTimeout(
            () => {

                const loader =
                    document.getElementById(
                        "pageLoader"
                    );

                const app =
                    document.getElementById(
                        "app"
                    );

                loader?.classList.add(
                    "hidden"
                );

                app?.classList.remove(
                    "hidden"
                );

            },
            5000
        );

    }
);

</script>
