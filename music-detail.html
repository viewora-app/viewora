<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("viewora_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Song · Viewora</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="theme.css">
    <style>
        :root {
            --bg: #0a0a0f; --card: rgba(255,255,255,.05); --border: rgba(255,255,255,.08);
            --text: #fff; --muted: #9ca3af; --accent: #7c5cff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: Inter, system-ui, sans-serif; padding-bottom: 100px;
        }
        .mdHeader {
            position: sticky; top: 0; z-index: 20;
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px;
            background: rgba(10,10,15,.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }
        .mdHeader h1 { font-size: 16px; font-weight: 700; flex: 1; }
        .mdBack {
            width: 40px; height: 40px; border: 0; border-radius: 12px;
            background: var(--card); color: #fff; display: grid; place-items: center;
        }
        .mdHero {
            padding: 24px 16px 16px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; gap: 12px;
        }
        .mdCover {
            width: 160px; height: 160px; border-radius: 20px;
            object-fit: cover; background: #1a1a24;
            box-shadow: 0 16px 40px rgba(0,0,0,.45);
        }
        .mdHero h2 { font-size: 20px; font-weight: 800; }
        .mdHero p { color: var(--muted); font-size: 13px; }
        .mdStats {
            display: flex; gap: 18px; justify-content: center;
            margin-top: 4px; font-size: 12px; color: var(--muted);
        }
        .mdStats strong { color: #fff; }
        .mdActions {
            display: flex; gap: 10px; width: 100%; max-width: 360px; margin-top: 8px;
        }
        .mdBtn {
            flex: 1; height: 46px; border: 0; border-radius: 14px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .mdBtn.primary {
            background: linear-gradient(135deg, #7c5cff, #4f8cff); color: #fff;
        }
        .mdBtn.ghost {
            background: var(--card); color: #fff; border: 1px solid var(--border);
        }
        .mdSection {
            padding: 8px 16px 20px;
        }
        .mdSection h3 {
            font-size: 14px; font-weight: 700; margin-bottom: 12px;
        }
        .mdGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .mdThumb {
            position: relative;
            aspect-ratio: 9/16;
            border-radius: 10px;
            overflow: hidden;
            background: #15151c;
            cursor: pointer;
        }
        .mdThumb img, .mdThumb video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .mdThumb .views {
            position: absolute; left: 6px; bottom: 6px;
            font-size: 10px; font-weight: 700;
            text-shadow: 0 1px 3px #000;
        }
        .mdEmpty {
            padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px;
        }
        .mdPlaying {
            color: #22c55e;
        }

        .mdCoverWrap {
            position: relative;
            width: 120px; height: 120px;
            margin: 0 auto 14px;
        }
        .mdCoverWrap .mdCover {
            width: 120px; height: 120px;
            border-radius: 16px;
            object-fit: cover;
            display: block;
            box-shadow: 0 12px 40px rgba(0,0,0,.45);
        }
        .mdCoverWrap .mdAvatar {
            position: absolute;
            right: -6px; bottom: -6px;
            width: 42px; height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0b0b10;
            background: #222;
        }
        .mdArtistRow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 10px;
            padding: 6px 12px 6px 6px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.06);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .mdArtistRow img {
            width: 28px; height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
        .mdArtistPlain {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
        }
        .mdHero h2 { margin: 0 0 8px; }


        .mdThumb .mdBadge {
            position: absolute; right: 6px; top: 6px;
            font-size: 9px; font-weight: 800; letter-spacing: .03em;
            text-transform: uppercase;
            background: rgba(0,0,0,.72);
            color: #fff;
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,.18);
        }
        .mdThumb .mdBadge.orig {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
        }

    </style>
</head>
<body>
<header class="mdHeader">
    <button type="button" class="mdBack" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button>
    <img src="assets/logo.png" alt="" width="26" height="26" style="border-radius:7px" onerror="this.style.display='none'">
    <h1 id="pageTitle">Song</h1>
</header>

<section class="mdHero">
    <div class="mdCoverWrap">
        <img class="mdCover" id="cover" src="assets/logo.png" alt="">
        <img class="mdAvatar" id="avatar" src="assets/logo.png" alt="" hidden>
    </div>
    <h2 id="title">—</h2>
    <button type="button" class="mdArtistRow" id="artistBtn" hidden>
        <img id="artistAvatar" src="assets/logo.png" alt="">
        <span id="artist">—</span>
        <i class="fa-solid fa-chevron-right" style="opacity:.5;font-size:11px"></i>
    </button>
    <p id="artistPlain" class="mdArtistPlain">—</p>
    <div class="mdStats">
        <span><strong id="useCount">0</strong> videos</span>
        <span><strong id="genreLabel">—</strong></span>
    </div>
    <div class="mdActions">
        <button type="button" class="mdBtn ghost" id="playBtn">
            <i class="fa-solid fa-play" id="playIcon"></i> Play
        </button>
        <button type="button" class="mdBtn primary" id="useBtn">
            <i class="fa-solid fa-plus"></i> Use this sound
        </button>
    </div>
</section>

<section class="mdSection">
    <h3>Videos with this sound</h3>
    <div class="mdGrid" id="grid">
        <div class="mdEmpty" style="grid-column:1/-1">Loading…</div>
    </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="theme.js"></script>
<script src="nav.js" defer></script>
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const musicId = params.get("id") || params.get("musicId") || "";
    const musicName = params.get("name") || params.get("title") || "";
    let track = null;
    let audio = null;
    let related = [];

    function db() {
        return window.db || (typeof firebase !== "undefined" ? firebase.database() : null);
    }
    function esc(s) {
        return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
    function fmt(n) {
        n = Number(n) || 0;
        if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
        return String(n);
    }

    function stop() {
        if (audio) {
            try { audio.pause(); } catch (_) {}
            audio = null;
        }
        const icon = document.getElementById("playIcon");
        if (icon) icon.className = "fa-solid fa-play";
        document.getElementById("playBtn").classList.remove("mdPlaying");
    }

    function play() {
        if (!track) return;
        const url = track.audioUrl || track.url || track.src || "";
        if (!url) {
            alert("No audio file");
            return;
        }
        if (audio && !audio.paused) {
            audio.pause();
            document.getElementById("playIcon").className = "fa-solid fa-play";
            return;
        }
        stop();
        audio = new Audio(url);
        audio.volume = 0.9;
        const start = Number(track.startAt || track.musicStartAt || 0);
        audio.addEventListener("loadedmetadata", () => {
            try { audio.currentTime = start; } catch (_) {}
        });
        audio.play().catch(() => {});
        document.getElementById("playIcon").className = "fa-solid fa-pause";
        document.getElementById("playBtn").classList.add("mdPlaying");
        audio.addEventListener("ended", stop);
    }

    async function loadTrack() {
        const database = db();
        if (!database) return null;
        if (musicId) {
            const snap = await database.ref("musicLibrary/" + musicId).once("value");
            if (snap.exists()) return { id: musicId, ...(snap.val() || {}) };
            // try scan
            const all = await database.ref("musicLibrary").once("value");
            let found = null;
            all.forEach((c) => {
                if (c.key === musicId) found = { id: c.key, ...(c.val() || {}) };
            });
            if (found) return found;
        }
        if (musicName) {
            const all = await database.ref("musicLibrary").once("value");
            let found = null;
            const q = musicName.toLowerCase();
            all.forEach((c) => {
                const v = c.val() || {};
                const t = String(v.title || v.name || "").toLowerCase();
                if (!found && t && (t === q || t.includes(q) || q.includes(t))) {
                    found = { id: c.key, ...v };
                }
            });
            if (found) return found;
            // synthetic track from name only
            const audioParam = params.get("audio") || params.get("video") || "";
            const shortId = params.get("shortId") || "";
            const isOrig = params.get("original") === "1" || String(musicId).indexOf("orig_") === 0;
            return {
                id: musicId || (shortId ? "orig_" + shortId : ""),
                title: musicName || (isOrig ? "Original audio" : "Sound"),
                name: musicName || (isOrig ? "Original audio" : "Sound"),
                artist: params.get("artist") || "",
                audioUrl: audioParam,
                url: audioParam,
                isOriginal: isOrig,
                sourceShortId: shortId,
                shortId: shortId,
                uses: 0
            };
        }
        // Original audio without library id
        const audioParam = params.get("audio") || params.get("video") || "";
        const shortId = params.get("shortId") || "";
        if (musicName || shortId || audioParam) {
            const isOrig = params.get("original") === "1" || !musicId;
            return {
                id: musicId || (shortId ? "orig_" + shortId : ""),
                title: musicName || "Original audio",
                name: musicName || "Original audio",
                artist: params.get("artist") || "",
                audioUrl: audioParam,
                url: audioParam,
                isOriginal: isOrig,
                sourceShortId: shortId,
                shortId: shortId,
                uses: 0
            };
        }
        return null;
    }

    function matchesMusic(item, t) {
        if (!item || !t) return false;
        const mid = String(t.id || t.musicId || "").toLowerCase();
        const title = String(t.title || t.name || "").toLowerCase().trim();
        const audio = String(t.audioUrl || t.url || t.src || "").toLowerCase();
        const sourceShort = String(t.sourceShortId || t.shortId || "").toLowerCase();
        const isOrig =
            !!t.isOriginal ||
            mid.indexOf("orig_") === 0 ||
            title.indexOf("original") === 0;

        // Direct id hits (musicId / originalSoundId)
        const candidateIds = [
            item.musicId,
            item.soundId,
            item.originalSoundId,
            item.music && item.music.id,
            item.music && item.music.musicId,
            item.music && item.music.originalSoundId,
            item.sound && item.sound.id
        ]
            .filter(Boolean)
            .map((x) => String(x).toLowerCase());

        if (mid && candidateIds.indexOf(mid) !== -1) return true;

        // Same source original short (creator's own short + anyone who reused it)
        if (sourceShort) {
            if (String(item.id || "").toLowerCase() === sourceShort) return true;
            if (
                item.music &&
                String(item.music.sourceShortId || "").toLowerCase() === sourceShort
            )
                return true;
            if (String(item.sourceShortId || "").toLowerCase() === sourceShort)
                return true;
            // reused as orig_{sourceShort}
            if (candidateIds.indexOf("orig_" + sourceShort) !== -1) return true;
        }

        // Same audio file URL
        if (audio) {
            const urls = [
                item.musicUrl,
                item.audioUrl,
                item.music && item.music.audioUrl,
                item.music && item.music.url,
                item.music && item.music.src
            ]
                .filter(Boolean)
                .map((x) => String(x).toLowerCase());
            if (urls.indexOf(audio) !== -1) return true;
        }

        // Library tracks only: title match (NOT for original audio — too broad)
        if (!isOrig && title && title !== "original audio") {
            const fields = [
                item.musicTitle,
                item.musicName,
                item.audioTitle,
                item.music && item.music.title,
                item.music && item.music.name
            ];
            for (let i = 0; i < fields.length; i++) {
                const f = fields[i];
                if (f == null) continue;
                const s = String(f).toLowerCase().trim();
                if (!s) continue;
                if (s === title) return true;
            }
        }
        return false;
    }

        async function loadRelated() {
        const database = db();
        const grid = document.getElementById("grid");
        if (!database || !track) {
            grid.innerHTML = '<div class="mdEmpty" style="grid-column:1/-1">No videos yet</div>';
            return;
        }
        related = [];
        const seen = {};

        function pushItem(id, root, v) {
            if (!id || seen[root + ":" + id]) return;
            seen[root + ":" + id] = true;
            related.push({
                id: id,
                root: root,
                thumb:
                    v.thumbnail ||
                    v.thumbnailUrl ||
                    v.thumbnailURL ||
                    v.cover ||
                    v.poster ||
                    "",
                video:
                    v.videoUrl ||
                    v.videoURL ||
                    v.mediaUrl ||
                    v.mediaURL ||
                    "",
                views: Number(v.views || v.viewCount || 0) || 0,
                title: v.title || v.caption || ""
            });
        }

        const mid = String(track.id || track.musicId || "").trim();

        // 1) Direct index: musicLibrary/{id}/usedBy/{shortId}
        if (mid && mid.indexOf("orig_") !== 0 && mid !== "original") {
            try {
                const used = await database.ref("musicLibrary/" + mid + "/usedBy").once("value");
                if (used.exists()) {
                    const jobs = [];
                    used.forEach((c) => {
                        const sid = c.key;
                        jobs.push(
                            database.ref("shorts/" + sid).once("value").then((s) => {
                                if (s.exists()) pushItem(sid, "shorts", s.val() || {});
                            }).catch(() => {})
                        );
                    });
                    await Promise.all(jobs);
                }
            } catch (_) {}
        }

        // 2) Scan shorts / videos / posts for same musicId or original sound
        const roots = ["shorts", "videos", "posts"];
        for (const root of roots) {
            try {
                const snap = await database.ref(root).limitToLast(400).once("value");
                if (!snap.exists()) continue;
                snap.forEach((c) => {
                    const v = c.val() || {};
                    if (matchesMusic(v, track)) {
                        pushItem(c.key, root, v);
                    }
                });
            } catch (_) {}
        }

        // 3) Original audio: always include source short
        const sourceShort = String(
            track.sourceShortId ||
                track.shortId ||
                params.get("shortId") ||
                ""
        ).toLowerCase();
        if (sourceShort && !seen["shorts:" + sourceShort]) {
            try {
                const s = await database.ref("shorts/" + sourceShort).once("value");
                if (s.exists()) pushItem(sourceShort, "shorts", s.val() || {});
            } catch (_) {}
        }

        const useEl = document.getElementById("useCount");
        if (useEl) {
            useEl.textContent = fmt(
                Math.max(Number(track.uses || 0), related.length)
            );
        }

        if (!related.length) {
            grid.innerHTML =
                '<div class="mdEmpty" style="grid-column:1/-1">No shorts with this sound yet. Be the first!</div>';
            return;
        }

        // Source / original short always first, then by views
        related.sort((a, b) => {
            const aSrc = String(a.id || "").toLowerCase() === sourceShort;
            const bSrc = String(b.id || "").toLowerCase() === sourceShort;
            if (aSrc && !bSrc) return -1;
            if (bSrc && !aSrc) return 1;
            return (b.views || 0) - (a.views || 0);
        });
        grid.innerHTML = related
            .slice(0, 90)
            .map((r) => {
                const href =
                    r.root === "shorts"
                        ? "shorts.html?id=" + encodeURIComponent(r.id)
                        : r.root === "videos"
                          ? "video.html?id=" + encodeURIComponent(r.id)
                          : "post.html?id=" + encodeURIComponent(r.id);
                const media = r.thumb
                    ? '<img src="' + esc(r.thumb) + '" alt="" loading="lazy" onerror="this.style.opacity=.3">'
                    : r.video
                      ? '<video src="' + esc(r.video) + '" muted playsinline></video>'
                      : '<div style="display:grid;place-items:center;height:100%;opacity:.4"><i class="fa-solid fa-music"></i></div>';
                const isSource =
                    sourceShort &&
                    String(r.id || "").toLowerCase() === sourceShort;
                const badge = isSource
                    ? '<span class="mdBadge orig">Original</span>'
                    : "";
                return (
                    '<a class="mdThumb" href="' +
                    href +
                    '">' +
                    media +
                    badge +
                    '<span class="views"><i class="fa-solid fa-play"></i> ' +
                    fmt(r.views) +
                    "</span></a>"
                );
            })
            .join("");
    }

    async function boot() {
        document.getElementById("backBtn").onclick = () => {
            stop();
            if (history.length > 1) history.back();
            else location.href = "music-store.html";
        };
        document.getElementById("playBtn").onclick = play;
        document.getElementById("useBtn").onclick = () => {
            if (!track) return;
            const payload = {
                id: track.id || track.musicId || "",
                musicId: track.id || track.musicId || "",
                title: track.isOriginal
                    ? "Original audio"
                    : (track.title || track.name || "Sound"),
                name: track.isOriginal
                    ? "Original audio"
                    : (track.title || track.name || "Sound"),
                artist: track.artist || "",
                audioUrl: track.audioUrl || track.url || track.src || "",
                url: track.audioUrl || track.url || track.src || "",
                isOriginal: !!track.isOriginal,
                sourceShortId:
                    track.sourceShortId ||
                    track.shortId ||
                    params.get("shortId") ||
                    "",
                coverUrl: track.coverUrl || track.cover || "",
                avatarUrl: track.avatarUrl || track.photoURL || "",
                uid: track.uid || params.get("uid") || ""
            };
            const vurl = params.get("video") || track.videoUrl || "";
            if (!payload.audioUrl && vurl) {
                payload.audioUrl = vurl;
                payload.url = vurl;
                payload.fromVideo = true;
            }
            try {
                sessionStorage.setItem(
                    "vieworaSelectedMusic",
                    JSON.stringify(payload)
                );
                localStorage.setItem(
                    "viewora_selected_music",
                    JSON.stringify(payload)
                );
            } catch (_) {}
            stop();
            // Pick / record a NEW video first, then editor — not short-edit details page
            location.href =
                "upload.html?type=shorts&useMusic=1";
        };

        track = await loadTrack();
        if (!track) {
            document.getElementById("title").textContent = "Song not found";
            document.getElementById("grid").innerHTML =
                '<div class="mdEmpty" style="grid-column:1/-1">Track missing</div>';
            return;
        }
        // Resolve original creator name if missing
        const isOrig =
            track.isOriginal ||
            String(track.id || "").indexOf("orig_") === 0 ||
            String(track.title || "").toLowerCase().indexOf("original") === 0;
        track.isOriginal = !!isOrig;

        if (isOrig) {
            const uid = params.get("uid") || track.uid || track.userId || "";
            const sid = track.sourceShortId || track.shortId || params.get("shortId") || "";
            try {
                if (uid && db()) {
                    const u = await db().ref("users/" + uid).once("value");
                    if (u.exists()) {
                        const uv = u.val() || {};
                        const name =
                            uv.username ||
                            uv.userName ||
                            uv.displayName ||
                            uv.name ||
                            "";
                        if (name) track.artist = name.replace(/^@/, "");
                        const pic =
                            uv.photoURL ||
                            uv.avatar ||
                            uv.profilePic ||
                            uv.photo ||
                            "";
                        if (pic) {
                            track.avatarUrl = pic;
                            track.photoURL = pic;
                            // Keep cover as short thumb if present; else avatar
                            if (!track.coverUrl) track.coverUrl = pic;
                        }
                        track.uid = uid;
                    }
                }
                if ((!track.artist || track.artist === "Unknown artist") && sid && db()) {
                    const s = await db().ref("shorts/" + sid).once("value");
                    if (s.exists()) {
                        const sv = s.val() || {};
                        const name =
                            sv.username ||
                            sv.userName ||
                            sv.name ||
                            "";
                        if (name) track.artist = String(name).replace(/^@/, "");
                        if (!track.coverUrl) {
                            track.coverUrl =
                                sv.thumbnail ||
                                sv.thumbnailUrl ||
                                sv.cover ||
                                "";
                        }
                    }
                }
            } catch (_) {}
            if (!track.title || String(track.title).toLowerCase() === "song") {
                track.title = "Original audio";
                track.name = "Original audio";
            }
        }

        const coverUrl = track.coverUrl || track.cover || "assets/logo.png";
        const avatarUrl =
            track.avatarUrl ||
            track.photoURL ||
            track.profilePic ||
            coverUrl ||
            "assets/logo.png";
        document.getElementById("cover").src = coverUrl;

        const avatarEl = document.getElementById("avatar");
        const artistBtn = document.getElementById("artistBtn");
        const artistPlain = document.getElementById("artistPlain");
        const artistAvatar = document.getElementById("artistAvatar");
        const artistSpan = document.getElementById("artist");

        const uname = String(track.artist || "").replace(/^@/, "").trim();
        const uid =
            params.get("uid") ||
            track.uid ||
            track.userId ||
            "";

        if (isOrig) {
            document.getElementById("title").textContent = "Original audio";
            document.getElementById("pageTitle").textContent =
                uname ? "Original audio · " + uname : "Original audio";
            document.getElementById("genreLabel").textContent = "Original";
            if (avatarEl) {
                avatarEl.src = avatarUrl;
                avatarEl.hidden = false;
            }
            if (artistBtn && uname) {
                artistBtn.hidden = false;
                if (artistPlain) artistPlain.hidden = true;
                if (artistAvatar) artistAvatar.src = avatarUrl;
                if (artistSpan) artistSpan.textContent = "@" + uname;
                artistBtn.onclick = () => {
                    if (uid) location.href = "profile.html?uid=" + encodeURIComponent(uid);
                    else if (uname)
                        location.href =
                            "profile.html?user=" + encodeURIComponent(uname);
                };
            } else if (artistPlain) {
                artistPlain.hidden = false;
                artistPlain.textContent = "Original sound";
            }
        } else {
            const displayTitle = track.title || track.name || "Song";
            document.getElementById("title").textContent = displayTitle;
            document.getElementById("pageTitle").textContent = displayTitle;
            document.getElementById("genreLabel").textContent =
                track.genre || "Music";
            if (avatarEl) avatarEl.hidden = true;
            if (artistBtn) artistBtn.hidden = true;
            if (artistPlain) {
                artistPlain.hidden = false;
                artistPlain.textContent =
                    (track.artist || "Unknown artist") +
                    (track.genre ? " · " + track.genre : "");
            }
        }
        document.getElementById("useCount").textContent = fmt(track.uses || 0);

        await loadRelated();
        // auto play preview lightly
        // play(); // user gesture better on mobile — skip auto
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
    else boot();
})();
</script>
</body>
</html>
