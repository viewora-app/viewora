<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("viewora_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <meta
        name="description"
        content="VIEWORA Messages — World • Create • Connect"
    >

    <title>Messages • VIEWORA</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- VIEWORA Messages CSS -->
    <link
        rel="stylesheet"
        href="messages.css">
    <link rel="stylesheet" href="nav.css"
    >
    <link rel="stylesheet" href="theme.css">
</head>

<body>

  

<!-- ======================================================
     APP
====================================================== -->

<main
    id="app"
    class="app"
>

    <!-- ==================================================
         HEADER
    ================================================== -->

    
    <!-- Minimal top: search handles primary UI; New is in search row -->
    <header class="messagesHeader messagesHeaderMinimal">
        <button id="newChatBtn" class="headerNewButton" type="button" aria-label="New message">
            <i class="fa-solid fa-pen"></i>
        </button>
        <button id="refreshBtn" class="iconButton hidden" type="button" aria-label="Refresh"></button>
    </header>



    <!-- ==================================================
         SEARCH
    ================================================== -->

    <section class="searchSection">

        <div class="searchBox">

            <i class="fa-solid fa-magnifying-glass searchIcon"></i>

            <input
                id="searchInput"
                type="search"
                placeholder="Search messages..."
                autocomplete="off"
                spellcheck="false"
            >

            <button
                id="clearSearch"
                class="clearSearch hidden"
                type="button"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

            <button id="newChatBtnSearch" class="searchNewBtn" type="button" aria-label="New">
                <i class="fa-solid fa-pen"></i>
            </button>

        </div>

    </section>



    <!-- NOTES / QUICK CREATE (Instagram style) -->
    <section class="notesSection" id="notesSection">
        <div class="notesScroller" id="notesScroller">
            <button type="button" class="noteItem noteCreate" id="createNoteBtn">
                <span class="noteAvatar notePlus" id="myNoteAvatarWrap">
                    <img id="myNoteAvatar" src="assets/default-avatar.png" alt="">
                    <i class="fa-solid fa-plus"></i>
                </span>
                <span class="noteLabel" id="myNoteLabel">Your note</span>
            </button>
            <div id="friendsNotes" class="friendsNotes"></div>
        </div>
    </section>

    <div class="messagesSectionHead">
        <h2>Messages</h2>
        <button type="button" class="requestsLink" id="requestsBtn">
            Requests
            <span id="requestsBadge" class="requestsBadge hidden">0</span>
        </button>
    </div>

    <!-- ==================================================
         FILTERS
    ================================================== -->

    <section class="filterSection">

        <div class="filterScroller">

            <button
                class="filter active"
                data-filter="all"
                type="button"
            >
                <i class="fa-solid fa-inbox"></i>
                All
            </button>

            <button
                class="filter"
                data-filter="unread"
                type="button"
            >
                <i class="fa-solid fa-envelope"></i>
                Unread

                <span
                    id="unreadBadge"
                    class="filterBadge hidden"
                >
                    0
                </span>

            </button>

            <button
                class="filter"
                data-filter="groups"
                type="button"
            >
                <i class="fa-solid fa-user-group"></i>
                Groups
            </button>

            <button
                class="filter"
                data-filter="online"
                type="button"
            >
                <span class="filterOnlineDot"></span>
                Online
            </button>

            <button
                class="filter"
                data-filter="pinned"
                type="button"
            >
                <i class="fa-solid fa-thumbtack"></i>
                Pinned
            </button>

        </div>

    </section>


    <!-- ==================================================
         CHAT AREA
    ================================================== -->

    <section class="chatSection">

        <span class="secureLabel">
                <i class="fa-solid fa-lock"></i>
                Private
            </span>

        </div>


        <!-- ==============================================
             SKELETON
        =============================================== -->

        <div
            id="chatSkeleton"
            class="chatSkeleton"
        >

            <div class="skeletonChat">
                <div class="skeletonCircle"></div>

                <div class="skeletonContent">
                    <div class="skeletonLine large"></div>
                    <div class="skeletonLine small"></div>
                </div>

                <div class="skeletonTime"></div>
            </div>

            <div class="skeletonChat">
                <div class="skeletonCircle"></div>

                <div class="skeletonContent">
                    <div class="skeletonLine large"></div>
                    <div class="skeletonLine small"></div>
                </div>

                <div class="skeletonTime"></div>
            </div>

            <div class="skeletonChat">
                <div class="skeletonCircle"></div>

                <div class="skeletonContent">
                    <div class="skeletonLine large"></div>
                    <div class="skeletonLine small"></div>
                </div>

                <div class="skeletonTime"></div>
            </div>

            <div class="skeletonChat">
                <div class="skeletonCircle"></div>

                <div class="skeletonContent">
                    <div class="skeletonLine large"></div>
                    <div class="skeletonLine small"></div>
                </div>

                <div class="skeletonTime"></div>
            </div>

        </div>


        <!-- ==============================================
             CHAT LIST
        =============================================== -->

        <div
            id="chatList"
            class="chatList"
        ></div>


        <!-- ==============================================
             EMPTY
        =============================================== -->

        <div
            id="emptyChats"
            class="emptyChats hidden"
        >

            <div class="emptyIllustration">

                <div class="emptyBubble bubbleOne">
                    <i class="fa-regular fa-comment"></i>
                </div>

                <div class="emptyBubble bubbleTwo">
                    <i class="fa-solid fa-heart"></i>
                </div>

                <div class="emptyBubble mainBubble">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>

            </div>

            <h3>No conversations yet</h3>

            <p>
                Connect with people and start
                your first conversation on VIEWORA.
            </p>

            <button
                id="startChatBtn"
                class="primaryButton"
                type="button"
            >
                <i class="fa-solid fa-plus"></i>
                Start a conversation
            </button>

        </div>

    </section>


    <!-- ==================================================
         NEW MESSAGE FAB
    ================================================== -->

    <button
        id="newMessageFab"
        class="newMessageFab"
        type="button"
        aria-label="New message"
    >

        <span class="fabGlow"></span>

        <i class="fa-solid fa-pen"></i>

        <span class="fabText">
            New message
        </span>

    </button>

</main>


<!-- ======================================================
     NEW CHAT MODAL
====================================================== -->

<div
    id="newChatModal"
    class="newChatModal hidden"
>

    <div
        id="newChatBackdrop"
        class="newChatBackdrop"
    ></div>


    <div class="newChatCard">

        <!-- Header -->

        <div class="newChatHeader">

            <div>

                <span class="sectionEyebrow">
                    VIEWORA
                </span>

                <h2>New message</h2>

            </div>

            <button
                id="closeNewChat"
                class="modalClose"
                type="button"
                aria-label="Close"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- Create types -->
        <div class="createTypeRow">
            <button type="button" class="createTypeBtn" data-create="group">
                <span class="createTypeIcon group"><i class="fa-solid fa-user-group"></i></span>
                <span class="createTypeText">
                    <strong>Group chat</strong>
                    <small>Chat with multiple friends</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button type="button" class="createTypeBtn gatedType hidden" data-create="teamwork" data-need="followers">
                <span class="createTypeIcon teamwork"><i class="fa-solid fa-briefcase"></i></span>
                <span class="createTypeText">
                    <strong>Teamwork</strong>
                    <small>Tasks &amp; collab — 10k followers</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button type="button" class="createTypeBtn gatedType hidden" data-create="community" data-need="creator">
                <span class="createTypeIcon community"><i class="fa-solid fa-people-roof"></i></span>
                <span class="createTypeText">
                    <strong>Community</strong>
                    <small>Topic-based group for fans</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button type="button" class="createTypeBtn gatedType hidden" data-create="podcast" data-need="creator">
                <span class="createTypeIcon podcast"><i class="fa-solid fa-microphone-lines"></i></span>
                <span class="createTypeText">
                    <strong>Podcast room</strong>
                    <small>Audio discussions &amp; drops</small>
                </span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Search -->
        <div class="newChatSearchBox">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                id="newChatSearch"
                type="search"
                placeholder="Search people..."
                autocomplete="off"
                spellcheck="false"
            >
        </div>

        <!-- People -->
        <div class="newChatPeopleHeader">
            <span>Suggested</span>
            <span class="peopleHint">Friends &amp; people you follow</span>
        </div>


        <div
            id="usersLoading"
            class="usersLoading hidden"
        >

            <div class="miniSpinner"></div>

            <span>
                Finding people...
            </span>

        </div>


        <div
            id="newChatUserList"
            class="newChatUserList"
        ></div>


        <div
            id="emptyUsers"
            class="emptyUsers hidden"
        >

            <div class="emptyUserIcon">
                <i class="fa-solid fa-user-slash"></i>
            </div>

            <strong>No people found</strong>

            <span>
                Try another name or username.
            </span>

        </div>

    </div>

</div>



<!-- CREATE GROUP / COMMUNITY / PODCAST -->
<div id="createGroupSheet" class="createGroupSheet hidden" aria-hidden="true">
  <div class="createGroupBackdrop" data-close-create></div>
  <div class="createGroupPanel">
    <div class="createGroupHandle"></div>
    <header class="createGroupHead">
      <button type="button" data-close-create class="createBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <h2 id="createGroupTitle">New group</h2>
      <button type="button" id="createGroupSubmit" class="createSubmit" disabled>Create</button>
    </header>
    <div class="createGroupBody">
      <div class="createAvatarPick">
        <button type="button" id="groupPhotoBtn" class="groupPhotoBtn">
          <i class="fa-solid fa-camera"></i>
          <span>Add photo</span>
        </button>
        <input type="file" id="groupPhotoInput" accept="image/*" hidden>
        <img id="groupPhotoPreview" class="groupPhotoPreview hidden" alt="">
      </div>
      <label class="createField">
        <span id="createNameLabel">Group name</span>
        <input type="text" id="groupNameInput" maxlength="40" placeholder="Name" autocomplete="off">
      </label>
      <label class="createField">
        <span>Description (optional)</span>
        <textarea id="groupDescInput" maxlength="160" placeholder="What is this about?" rows="2"></textarea>
      </label>
      <div class="createMembersHead">
        <strong>Add members</strong>
        <span id="selectedMembersCount">0 selected</span>
      </div>
      <div class="createMemberSearch">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="memberSearchInput" placeholder="Search friends..." autocomplete="off">
      </div>
      <div id="createMemberList" class="createMemberList"></div>
    </div>
  </div>
</div>

<!-- ======================================================
     TOAST
====================================================== -->

<div
    id="toast"
    class="toast hidden"
    role="status"
    aria-live="polite"
>

    <div class="toastIcon">

        <i class="fa-solid fa-check"></i>

    </div>

    <span id="toastText">
        Done
    </span>

</div>


<!-- ======================================================
     GLOBAL MESSAGE BADGE
====================================================== -->

<span
    id="messageBadge"
    class="globalMessageBadge hidden"
>
    0
</span>


<!-- ======================================================
     FIREBASE
     
     Keep your existing Firebase SDK initialization.
     If firebase.js already loads these scripts, don't
     duplicate them.
====================================================== -->

<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"
></script>

<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"
></script>

<script
    src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"
></script>


<!-- Your Firebase configuration -->
<script src="firebase.js"></script>
<script src="theme.js"></script>
  <script src="badges.js"></script>

  <script src="call-listener.js"></script>
<!-- Messages logic -->
<script src="messages.js"></script>
<script src="account-session.js"></script>
<script src="nav.js"></script>

</body>
</html>
