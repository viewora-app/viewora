<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Messages • Viewora</title>

    <meta name="theme-color" content="#08080d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="icon" href="assets/logo.png">

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ICONS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="messages.css">
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="aurora auroraOne"></div>
    <div class="aurora auroraTwo"></div>
    <div class="aurora auroraThree"></div>

    <div class="noise"></div>

</div>


<!-- =====================================================
     PAGE LOADER
===================================================== -->

<div id="loadingOverlay" class="loadingOverlay">

    <div class="loadingCard">

        <img
            src="assets/logo.png"
            class="loadingLogo"
            alt="Viewora"
        >

        <div class="loadingTitle">
            VIEWORA
        </div>

        <div class="loadingSubtitle">
            Loading messages
        </div>

        <div class="loadingLine">
            <div class="loadingProgress"></div>
        </div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app" class="app hidden">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="topHeader">

        <div class="headerLeft">

            <button
                class="headerButton"
                id="backBtn"
                type="button"
                aria-label="Back"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="headerTitle">

                <h1>Messages</h1>

                <span id="connectionStatus">
                    Connecting...
                </span>

            </div>

        </div>


        <div class="headerActions">

            <button
                id="refreshBtn"
                class="headerButton"
                type="button"
                aria-label="Refresh"
            >
                <i class="fa-solid fa-rotate"></i>
            </button>

            <button
                id="newChatBtn"
                class="headerButton primaryHeaderButton"
                type="button"
                aria-label="New chat"
            >
                <i class="fa-solid fa-pen"></i>
            </button>

        </div>

    </header>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <section class="searchSection">

        <div class="searchBox">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                id="searchInput"
                type="search"
                autocomplete="off"
                placeholder="Search messages..."
            >

            <button
                id="clearSearch"
                class="clearSearch hidden"
                type="button"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

    </section>


    <!-- =================================================
         FILTERS
    ================================================== -->

    <nav class="filters" aria-label="Message filters">

        <button
            class="filter active"
            data-filter="all"
            type="button"
        >
            All
        </button>

        <button
            class="filter"
            data-filter="unread"
            type="button"
        >
            Unread

            <span
                id="unreadBadge"
                class="filterBadge hidden"
            >
                0
            </span>

        </button>

        <button
            class="filter"
            data-filter="online"
            type="button"
        >
            Online
        </button>

        <button
            class="filter"
            data-filter="pinned"
            type="button"
        >
            Pinned
        </button>

    </nav>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="messagesMain">


        <!-- =============================================
             PINNED
        ============================================== -->

        <section
            id="pinnedSection"
            class="chatSection hidden"
        >

            <div class="sectionHeader">

                <div class="sectionHeading">

                    <i class="fa-solid fa-thumbtack"></i>

                    <span>Pinned</span>

                </div>

            </div>

            <div
                id="pinnedChatList"
                class="chatList"
            ></div>

        </section>


        <!-- =============================================
             RECENT
        ============================================== -->

        <section class="chatSection">

            <div class="sectionHeader">

                <div class="sectionHeading">

                    <span>Recent Messages</span>

                </div>

                <span
                    id="chatCount"
                    class="chatCount"
                >
                    0
                </span>

            </div>


            <!-- SKELETON -->

            <div
                id="chatSkeleton"
                class="chatSkeleton"
            >

                <div class="skeletonItem">

                    <div class="skeletonAvatar"></div>

                    <div class="skeletonText">

                        <div class="skeletonLine title"></div>

                        <div class="skeletonLine message"></div>

                    </div>

                </div>


                <div class="skeletonItem">

                    <div class="skeletonAvatar"></div>

                    <div class="skeletonText">

                        <div class="skeletonLine title"></div>

                        <div class="skeletonLine message"></div>

                    </div>

                </div>


                <div class="skeletonItem">

                    <div class="skeletonAvatar"></div>

                    <div class="skeletonText">

                        <div class="skeletonLine title"></div>

                        <div class="skeletonLine message"></div>

                    </div>

                </div>


                <div class="skeletonItem">

                    <div class="skeletonAvatar"></div>

                    <div class="skeletonText">

                        <div class="skeletonLine title"></div>

                        <div class="skeletonLine message"></div>

                    </div>

                </div>

            </div>


            <!-- REAL CHAT LIST -->

            <div
                id="chatList"
                class="chatList hidden"
            ></div>


            <!-- EMPTY -->

            <div
                id="emptyChats"
                class="emptyState hidden"
            >

                <div class="emptyIcon">
                    <i class="fa-regular fa-comments"></i>
                </div>

                <h2>No conversations yet</h2>

                <p>
                    Start a conversation with someone on Viewora.
                </p>

                <button
                    id="startChatBtn"
                    class="startChatButton"
                    type="button"
                >
                    <i class="fa-solid fa-plus"></i>
                    Start a Chat
                </button>

            </div>

        </section>

    </main>


    <!-- =================================================
         NEW CHAT MODAL
    ================================================== -->

    <div
        id="newChatModal"
        class="modal hidden"
    >

        <div
            class="modalBackdrop"
            id="newChatBackdrop"
        ></div>


        <div class="modalCard">

            <div class="modalHeader">

                <div>

                    <span class="modalEyebrow">
                        VIEWORA
                    </span>

                    <h2>New Conversation</h2>

                </div>

                <button
                    id="closeNewChat"
                    class="modalClose"
                    type="button"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <div class="modalSearch">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="newChatSearch"
                    type="search"
                    autocomplete="off"
                    placeholder="Search people..."
                >

            </div>


            <div
                id="usersLoading"
                class="usersLoading hidden"
            >

                <div class="miniSpinner"></div>

                <span>
                    Finding people...
                </span>

            </div>


            <div
                id="newChatUserList"
                class="newChatUserList"
            ></div>


            <div
                id="emptyUsers"
                class="emptyUsers hidden"
            >

                <i class="fa-regular fa-user"></i>

                <h3>No users found</h3>

                <p>
                    Try another username.
                </p>

            </div>

        </div>

    </div>


    <!-- =================================================
         TOAST
    ================================================== -->

    <div
        id="toast"
        class="toast hidden"
    >

        <div class="toastIcon">
            <i class="fa-solid fa-check"></i>
        </div>

        <div>

            <strong>Viewora</strong>

            <p id="toastText">
                Done
            </p>

        </div>

    </div>


    <!-- =================================================
         NEW CHAT FAB
    ================================================== -->

    <button
        id="newMessageFab"
        class="newMessageFab"
        type="button"
        aria-label="New message"
    >

        <i class="fa-solid fa-pen"></i>

    </button>


    <!-- =================================================
         REFRESH INDICATOR
    ================================================== -->

    <div
        id="refreshIndicator"
        class="refreshIndicator hidden"
    >

        <div class="miniSpinner"></div>

        <span>
            Updating...
        </span>

    </div>


    <!-- =================================================
         CONNECTION BANNER
    ================================================== -->

    <div
        id="connectionBanner"
        class="connectionBanner hidden"
    >

        <i class="fa-solid fa-wifi"></i>

        <span>
            Connection restored
        </span>

    </div>


</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>


<!-- =====================================================
     VIEWORA FIREBASE CONFIG
===================================================== -->

<script src="firebase.js"></script>


<!-- =====================================================
     MESSAGES LOGIC
===================================================== -->

<script src="messages.js"></script>

</body>
</html>
