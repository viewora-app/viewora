<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("viewora_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050507">
  <title>Viewora • Search</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>

<div class="search-page">

  <!-- Header -->
  <header class="search-header">
    <button type="button" class="search-back" id="searchBack" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="search-field-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        id="searchInput"
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Search users, videos, shorts..."
      >
      <button type="button" id="clearSearch" class="hidden" aria-label="Clear">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <button type="button" class="search-mic" id="searchMic" aria-label="Voice search">
      <i class="fa-solid fa-microphone"></i>
    </button>
    <button type="button" class="search-go" id="searchGo" aria-label="Search">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </header>

  <!-- Tabs -->
  <div class="search-tabs" id="searchTabs">
    <button type="button" class="search-tab active" data-tab="all">All</button>
    <button type="button" class="search-tab" data-tab="people">People</button>
    <button type="button" class="search-tab" data-tab="videos">Videos</button>
    <button type="button" class="search-tab" data-tab="shorts">Shorts</button>
    <button type="button" class="search-tab" data-tab="posts">Posts</button>
  </div>

  <!-- Recent -->
  <section class="section" id="recentSection">
    <div class="section-header">
      <h2 class="section-title">Recent</h2>
      <button type="button" class="section-action" id="clearAllRecent">Clear all</button>
    </div>
    <div class="chip-row" id="recentList"></div>
  </section>

  <!-- Trending -->
  <section class="section" id="trendingSection">
    <div class="section-header">
      <h2 class="section-title">Trending</h2>
    </div>
    <div class="chip-row">
      <button type="button" class="chip" data-trend="Viewora">#Viewora</button>
      <button type="button" class="chip" data-trend="gaming">#Gaming</button>
      <button type="button" class="chip" data-trend="music">#Music</button>
      <button type="button" class="chip" data-trend="cricket">#Cricket</button>
      <button type="button" class="chip" data-trend="comedy">#Comedy</button>
      <button type="button" class="chip" data-trend="@">@username</button>
    </div>
  </section>

  <!-- Loading -->
  <section class="state-box hidden" id="loadingState">
    <div class="spinner"></div>
    <p>Searching…</p>
  </section>

  <!-- Results -->
  <section class="section hidden" id="resultsSection">
    <div class="section-header">
      <h2 class="section-title">Results</h2>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div id="resultsBody"></div>
  </section>

  <!-- Empty -->
  <section class="state-box hidden" id="emptyState">
    <i class="fa-solid fa-magnifying-glass"></i>
    <h3 id="emptyTitle">No results</h3>
    <p id="emptyText">Try another search.</p>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="badges.js"></script>
<script src="theme.js"></script>
<script src="search-page.js"></script>
<script src="nav.js"></script>

<script>
(function(){
  var mic = document.getElementById("searchMic");
  var input = document.getElementById("searchInput");
  if (!mic) return;
  mic.addEventListener("click", function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice search not supported on this device."); return; }
    var r = new SR();
    r.lang = "en-IN";
    mic.classList.add("listening");
    r.onresult = function(ev){
      var t = (ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript)||"";
      if (input) { input.value = t; input.dispatchEvent(new Event("input",{bubbles:true})); }
      var go = document.getElementById("searchGo");
      if (go) go.click();
    };
    r.onerror = r.onend = function(){ mic.classList.remove("listening"); };
    try { r.start(); } catch(e){ mic.classList.remove("listening"); }
  });
})();
</script>


<script>
(function(){
  try {
    var q = new URLSearchParams(location.search).get("q") || "";
    var input = document.getElementById("searchInput");
    if (q && input) {
      input.value = q;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      setTimeout(function(){
        var go = document.getElementById("searchGo");
        if (go) go.click();
      }, 200);
    }
  } catch(e) {}
})();
</script>

</body>
</html>
