<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Viewora • Stories</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="stories.css">
</head>
<body>
<div id="app" class="storiesApp">

    <!-- Progress -->
    <div id="progressRow" class="progressRow"></div>

    <!-- Top bar -->
    <header class="storiesTop">
        <div class="storiesUser" id="storiesUser">
            <img id="storiesAvatar" src="assets/default-avatar.png" alt="">
            <div>
                <strong id="storiesName">User</strong>
                <small id="storiesTime"></small>
            </div>
        </div>
        <div class="storiesTopActions">
            <button type="button" id="storiesMoreBtn" class="storiesIconBtn" aria-label="More">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
            <button type="button" id="storiesCloseBtn" class="storiesIconBtn" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </header>

    <!-- Media stage -->
    <div id="stage" class="stage">
        <img id="storyImg" class="storyMedia hidden" alt="">
        <video id="storyVid" class="storyMedia hidden" playsinline></video>
        <div id="tapLeft" class="tapZone tapLeft"></div>
        <div id="tapRight" class="tapZone tapRight"></div>

        <div id="storyMusicBadge" class="storyMusicBadge hidden">
            <i class="fa-solid fa-music"></i>
            <span id="storyMusicBadgeText">Music</span>
        </div>
    </div>

    <!-- Reply / react (viewer) -->
    <footer id="viewerFooter" class="storiesFooter">
        <div class="reactRow" id="reactRow">
            <button type="button" class="reactBtn" data-reaction="❤️">❤️</button>
            <button type="button" class="reactBtn" data-reaction="😂">😂</button>
            <button type="button" class="reactBtn" data-reaction="🔥">🔥</button>
            <button type="button" class="reactBtn" data-reaction="😍">😍</button>
            <button type="button" class="reactBtn" data-reaction="😮">😮</button>
        </div>
        <div class="replyRow">
            <input id="replyInput" type="text" maxlength="300" placeholder="Reply to story…" autocomplete="off">
            <button type="button" id="replySendBtn" aria-label="Send">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <!-- Owner footer -->
    <footer id="ownerFooter" class="storiesFooter ownerFooter hidden">
        <button type="button" id="viewersBtn" class="ownerChip">
            <i class="fa-solid fa-eye"></i>
            <span id="viewersCount">0 views</span>
        </button>
        <button type="button" id="deleteStoryBtn" class="ownerChip danger">
            <i class="fa-regular fa-trash-can"></i>
            Delete
        </button>
    </footer>

    <!-- More sheet -->
    <div id="moreSheet" class="sheet hidden">
        <div class="sheetBackdrop" data-close="moreSheet"></div>
        <div class="sheetCard">
            <div class="sheetHandle"></div>
            <div id="ownerMenu" class="menuGroup hidden">
                <button type="button" id="mentionBtn" class="menuItem">
                    <i class="fa-solid fa-at"></i>
                    <span><strong>Mention</strong><small>Tag someone in this story</small></span>
                </button>
                <button type="button" id="collabBtn" class="menuItem">
                    <i class="fa-solid fa-user-plus"></i>
                    <span><strong>Collab</strong><small>Invite collaborator</small></span>
                </button>
                <button type="button" id="deleteFromMenuBtn" class="menuItem danger">
                    <i class="fa-regular fa-trash-can"></i>
                    <span><strong>Delete story</strong><small>Remove permanently</small></span>
                </button>
            </div>
            <div id="viewerMenu" class="menuGroup hidden">
                <button type="button" id="reportBtn" class="menuItem danger">
                    <i class="fa-regular fa-flag"></i>
                    <span><strong>Report</strong><small>Report this story</small></span>
                </button>
            </div>
            <button type="button" class="menuItem" data-close="moreSheet">
                <i class="fa-solid fa-xmark"></i>
                <span><strong>Cancel</strong></span>
            </button>
        </div>
    </div>

    <!-- Mention / Collab sheet -->
    <div id="peopleSheet" class="sheet hidden">
        <div class="sheetBackdrop" data-close="peopleSheet"></div>
        <div class="sheetCard">
            <div class="sheetHandle"></div>
            <header class="sheetHead">
                <strong id="peopleSheetTitle">Mention</strong>
                <button type="button" class="sheetClose" data-close="peopleSheet"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <input id="peopleSearch" type="search" placeholder="Search users…" autocomplete="off">
            <div id="peopleList" class="peopleList"></div>
        </div>
    </div>

    <!-- Viewers sheet -->
    <div id="viewersSheet" class="sheet hidden">
        <div class="sheetBackdrop" data-close="viewersSheet"></div>
        <div class="sheetCard">
            <div class="sheetHandle"></div>
            <header class="sheetHead">
                <strong>Viewers</strong>
                <button type="button" class="sheetClose" data-close="viewersSheet"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div id="viewersList" class="peopleList"></div>
        </div>
    </div>

    <audio id="storyAudio" playsinline preload="auto" loop style="display:none"></audio>
    <div id="toast" class="toast hidden"><span id="toastText">Done</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
  <script src="badges.js"></script>
<script src="stories.js"></script>
</body>
</html>
