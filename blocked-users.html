<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blocked users · Viewora</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="nav.css">
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0a0a0f; color:#fff; }
    .wrap { max-width:560px; margin:0 auto; padding:16px 16px 100px; }
    header { display:flex; align-items:center; gap:12px; padding:12px 0 20px; }
    header a { color:#fff; text-decoration:none; font-size:20px; }
    h1 { margin:0; font-size:20px; }
    .empty { text-align:center; padding:60px 20px; color:rgba(255,255,255,.55); }
    .empty i { font-size:40px; opacity:.4; margin-bottom:12px; }
    .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .row img { width:48px; height:48px; border-radius:50%; object-fit:cover; background:#222; }
    .row .meta { flex:1; min-width:0; }
    .row strong { display:block; font-size:15px; }
    .row span { font-size:13px; opacity:.55; }
    .row button { border:0; border-radius:10px; padding:8px 14px; background:rgba(255,255,255,.1); color:#fff; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="settings.html" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
      <h1>Blocked users</h1>
    </header>
    <div id="list"></div>
    <div id="empty" class="empty hidden">
      <i class="fa-solid fa-user-slash"></i>
      <p>No blocked users</p>
      <p style="font-size:13px">People you block won't be able to message or see your content.</p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="nav.js"></script>
  <script>
  (function(){
    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
    async function load(){
      var auth = window.auth || firebase.auth();
      var db = window.db || firebase.database();
      var user = auth.currentUser;
      if (!user) {
        await new Promise(function(res){ auth.onAuthStateChanged(function(u){ user=u; res(); }); });
      }
      if (!user) { location.href = "login.html"; return; }
      var list = $("list");
      var empty = $("empty");
      try {
        var snap = await db.ref("blocked/" + user.uid).once("value");
        if (!snap.exists()) {
          // alternate path
          snap = await db.ref("users/" + user.uid + "/blocked").once("value");
        }
        var data = snap.val() || {};
        var ids = Object.keys(data);
        if (!ids.length) {
          empty.classList.remove("hidden");
          return;
        }
        empty.classList.add("hidden");
        list.innerHTML = "";
        for (var i=0;i<ids.length;i++) {
          var uid = ids[i];
          var meta = data[uid] || {};
          var us = {};
          try {
            var usnap = await db.ref("users/" + uid).once("value");
            us = usnap.val() || {};
          } catch(_){}
          var name = us.username || us.displayName || meta.username || "User";
          var photo = us.profilePhoto || us.photoURL || us.avatar || "assets/default-avatar.png";
          var row = document.createElement("div");
          row.className = "row";
          row.innerHTML = '<img src="'+esc(photo)+'" onerror="this.src=\'assets/default-avatar.png\'" alt=""><div class="meta"><strong>'+esc(name)+'</strong><span>Blocked</span></div><button type="button" data-uid="'+esc(uid)+'">Unblock</button>';
          list.appendChild(row);
        }
        list.addEventListener("click", async function(e){
          var btn = e.target.closest("button[data-uid]");
          if (!btn) return;
          var uid = btn.getAttribute("data-uid");
          btn.disabled = true;
          try {
            await db.ref("blocked/" + user.uid + "/" + uid).remove();
            await db.ref("users/" + user.uid + "/blocked/" + uid).remove().catch(function(){});
            btn.closest(".row").remove();
            if (!list.querySelector(".row")) empty.classList.remove("hidden");
          } catch (err) {
            alert("Could not unblock");
            btn.disabled = false;
          }
        });
      } catch (e) {
        console.warn(e);
        empty.classList.remove("hidden");
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", load);
    else load();
  })();
  </script>
  <script src="nav.js"></script>
</body>
</html>
