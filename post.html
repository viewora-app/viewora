<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Viewora • Posts</title>

    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- =====================================================
         VIEWORA POSTS CSS
    ====================================================== -->

    <link rel="stylesheet" href="posts.css">

</head>


<body>

    <!-- =====================================================
         APP
    ====================================================== -->

    <div id="vieworaApp" class="viewora-app">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="topbar">

            <button
                id="backBtn"
                class="topbar-btn back-btn"
                type="button"
                aria-label="Go back"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </button>


            <div class="topbar-title">

                <span>Posts</span>

                <small id="postCounter">
                    Viewora
                </small>

            </div>


            <button
                id="headerMore"
                class="topbar-btn more-btn"
                type="button"
                aria-label="More options"
            >
                <i class="fa-solid fa-ellipsis"></i>
            </button>

        </header>


        <!-- =================================================
             MAIN FEED
        ================================================== -->

        <main
            id="postFeed"
            class="post-feed"
            aria-live="polite"
        >


            <!-- =============================================
                 LOADING
            ============================================== -->

            <section
                id="loadingState"
                class="state loading-state"
            >

                <div class="loading-spinner"></div>

                <strong>
                    Loading posts
                </strong>

                <span>
                    Please wait while Viewora loads the posts.
                </span>

            </section>


        </main>


    </div>


    <!-- =====================================================
         COMMENT SHEET
    ====================================================== -->

    <div
        id="commentSheet"
        class="bottom-sheet comment-sheet"
        aria-hidden="true"
    >

        <div
            id="commentBackdrop"
            class="sheet-backdrop"
        ></div>


        <section
            class="sheet-panel comment-panel"
            role="dialog"
            aria-modal="true"
            aria-label="Comments"
        >

            <div class="sheet-handle"></div>


            <header class="sheet-header">

                <div class="sheet-title">
                    Comments
                </div>


                <button
                    id="closeComments"
                    class="sheet-close"
                    type="button"
                    aria-label="Close comments"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </header>


            <!-- COMMENT LIST -->

            <div
                id="commentList"
                class="comment-list"
            >

                <div class="comment-empty">
                    Loading comments...
                </div>

            </div>


            <!-- COMMENT INPUT -->

            <div class="comment-input-area">

                <input
                    id="commentInput"
                    class="comment-input"
                    type="text"
                    maxlength="500"
                    autocomplete="off"
                    placeholder="Add a comment..."
                    aria-label="Write a comment"
                >


                <button
                    id="commentSend"
                    class="comment-send"
                    type="button"
                    aria-label="Send comment"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         POST MENU SHEET
    ====================================================== -->

    <div
        id="menuSheet"
        class="bottom-sheet menu-sheet"
        aria-hidden="true"
    >

        <div
            id="menuBackdrop"
            class="sheet-backdrop"
        ></div>


        <section
            class="sheet-panel menu-panel"
            role="dialog"
            aria-modal="true"
            aria-label="Post options"
        >

            <div class="sheet-handle"></div>


            <div class="menu-header">
                Post options
            </div>


            <!-- EDIT -->

            <button
                id="editPostBtn"
                class="menu-option"
                type="button"
            >

                <span class="menu-icon">
                    <i class="fa-solid fa-pen"></i>
                </span>

                <span>
                    Edit post
                </span>

            </button>


            <!-- DELETE -->

            <button
                id="deletePostBtn"
                class="menu-option menu-danger"
                type="button"
            >

                <span class="menu-icon">
                    <i class="fa-solid fa-trash"></i>
                </span>

                <span>
                    Delete post
                </span>

            </button>


            <!-- COPY LINK -->

            <button
                id="copyLinkBtn"
                class="menu-option"
                type="button"
            >

                <span class="menu-icon">
                    <i class="fa-solid fa-link"></i>
                </span>

                <span>
                    Copy post link
                </span>

            </button>


            <!-- REPORT -->

            <button
                id="reportPostBtn"
                class="menu-option menu-danger"
                type="button"
            >

                <span class="menu-icon">
                    <i class="fa-regular fa-flag"></i>
                </span>

                <span>
                    Report post
                </span>

            </button>


            <!-- CANCEL -->

            <button
                id="menuCancel"
                class="menu-cancel"
                type="button"
            >
                Cancel
            </button>

        </section>

    </div>


    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- =====================================================
         FIREBASE SDK
    ====================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>


    <!-- =====================================================
         VIEWORA FIREBASE CORE
    ====================================================== -->

    <script src="firebase.js"></script>
  <script src="badges.js"></script>


    <!-- =====================================================
         VIEWORA POSTS JS
    ====================================================== -->

    <script src="posts.js"></script>

</body>

</html>
