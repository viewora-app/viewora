<!DOCTYPE html>
<html lang="en">

<head>

<body>

    <!-- =====================================================
         APP
    ====================================================== -->

    <main
        id="app"
        class="discover-page"
    >

        <!-- =================================================
             HEADER
        ================================================== -->

        <header
            class="discover-header"
            aria-label="Discover header"
        >

            <button
                class="header-btn back-btn"
                id="backBtn"
                type="button"
                aria-label="Go back"

                <div class="discover-title-icon">

                        width="27"
                        height="27"

    <!-- =====================================================
         SMALL UI HELPERS
    ====================================================== -->

    <style>

        /* User count badge */

        .user-count-badge {
            flex: 0 0 auto;

            padding: 8px 12px;

            border: 1px solid rgba(255,255,255,.09);

            border-radius: 999px;

            background:
                rgba(255,255,255,.045);

            color: #aeb4c8;

            font-size: 11px;

            font-weight: 700;

            white-space: nowrap;
        }


        /* Search */

        .users-search {
            position: relative;

            display: flex;
            align-items: center;

            gap: 10px;

            width: 100%;

            height: 48px;

            margin-bottom: 14px;

            padding: 0 13px;

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 15px;

            background:
                rgba(255,255,255,.045);

            color: #858ca0;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .users-search:focus-within {
            border-color:
                rgba(120,103,255,.45);

            background:
                rgba(120,103,255,.055);

            box-shadow:
                0 0 0 3px rgba(120,103,255,.08);
        }


        .users-search input {
            min-width: 0;

            flex: 1;

            height: 100%;

            border: 0;
            outline: 0;

            background: transparent;

            color: white;

            font-family: inherit;

            font-size: 14px;
        }


        .users-search input::placeholder {
            color: #70778b;
        }


        .users-search input::-webkit-search-cancel-button {
            display: none;
        }


        .users-search button {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border: 0;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            color: #cbd0dc;

            font-size: 19px;

            cursor: pointer;
        }


        /* Bottom navigation internals */

        .bottom-nav {
            display: grid;

            grid-template-columns:
                1fr
                1fr
                1.15fr
                1fr
                1fr;

            align-items: center;

            padding:
                5px 8px
                max(5px, env(safe-area-inset-bottom));
        }


        .nav-item {
            height: 64px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            color: #8c92a4;

            text-decoration: none;

            font-size: 11px;

            font-weight: 650;

            transition:
                color .2s ease,
                transform .2s ease;
        }


        .nav-item svg {
            transition:
                transform .2s ease;
        }


        .nav-item.active {
            color: #18bfff;
        }


        .nav-item.active svg {
            filter:
                drop-shadow(
                    0 0 8px rgba(24,191,255,.35)
                );
        }


        .nav-item:active {
            transform: scale(.92);
        }


        .nav-create {
            height: 72px;

            display: grid;

            place-items: center;

            text-decoration: none;
        }


        .create-circle {
            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #20bfff,
                    #2879ff
                );

            color: white;

            border:
                4px solid rgba(8,10,18,.96);

            box-shadow:
                0 7px 25px rgba(25,168,255,.35);

            transition:
                transform .2s ease;
        }


        .nav-create:active .create-circle {
            transform: scale(.9);
        }


        /* Make cards cleaner when JS has no bio */

        .user-card-content:empty,
        .user-info:empty {
            display: none;
        }


        /* Better mobile list spacing */

        @media (max-width: 480px) {

            .user-count-badge {
                font-size: 10px;
                padding: 7px 10px;
            }

            .users-search {
                height: 46px;
            }
        }

    </style>


    <!-- =====================================================
         NAVIGATION FALLBACK
    ====================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const backBtn =
                document.getElementById("backBtn");

            const refreshBtn =
                document.getElementById("refreshUsers");

            const scrollTopBtn =
                document.getElementById("scrollTopBtn");

            const seeAll =
                document.getElementById("seeAllUsers");

            const searchInput =
                document.getElementById("userSearch");

            const clearSearch =
                document.getElementById("clearUserSearch");


            /* Back */

            if (backBtn) {

                backBtn.addEventListener("click", () => {

                    if (history.length > 1) {
                        history.back();
                    } else {
                        window.location.href =
                            "index.html";
                    }

                });

            }


            /* Refresh */

            if (refreshBtn) {

                refreshBtn.addEventListener(
                    "click",
                    () => {

                        refreshBtn.style.transform =
                            "rotate(180deg)";

                        setTimeout(() => {

                            refreshBtn.style.transform =
                                "";

                        }, 350);


                        /*
                         * users.js can listen for this event
                         * and reload Firebase users.
                         */

                        window.dispatchEvent(
                            new CustomEvent(
                                "viewora:refresh-users"
                            )
                        );

                    }
                );

            }


            /* See all */

            if (seeAll) {

                seeAll.addEventListener(
                    "click",
                    (event) => {

                        event.preventDefault();

                        document
                            .getElementById(
                                "allUsersSection"
                            )
                            ?.scrollIntoView({
                                behavior: "smooth",
                                block: "start"
                            });

                    }
                );

            }


            /* Scroll top */

            if (scrollTopBtn) {

                scrollTopBtn.addEventListener(
                    "click",
                    () => {

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );

            }


            /* Search clear */

            if (searchInput && clearSearch) {

                searchInput.addEventListener(
                    "input",
                    () => {

                        clearSearch.hidden =
                            !searchInput.value.trim();

                    }
                );


                clearSearch.addEventListener(
                    "click",
                    () => {

                        searchInput.value = "";

                        clearSearch.hidden = true;

                        searchInput.focus();

                        searchInput.dispatchEvent(
                            new Event("input", {
                                bubbles: true
                            })
                        );

                    }
                );

            }


            /* Filter buttons */

            document
                .querySelectorAll(".filter-btn")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(btn => {

                                    btn.classList.remove(
                                        "active"
                                    );

                                    btn.setAttribute(
                                        "aria-selected",
                                        "false"
                                    );

                                });


                            button.classList.add(
                                "active"
                            );

                            button.setAttribute(
                                "aria-selected",
                                "true"
                            );


                            window.dispatchEvent(
                                new CustomEvent(
                                    "viewora:user-filter",
                                    {
                                        detail: {
                                            filter:
                                                button.dataset.filter
                                        }
                                    }
                                )
                            );

                        }
                    );

                });


            /* Create */

            const createBtn =
                document.getElementById("createBtn");

            if (createBtn) {

                createBtn.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                        window.dispatchEvent(
                            new CustomEvent(
                                "viewora:create"
                            )
                        );

                    }
                );

            }

        });

    </script>

</body>

</html>
