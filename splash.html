<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Viewora</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div class="splash" id="splash">
    <div class="bgGlow bgGlow-a"></div>
    <div class="bgGlow bgGlow-b"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <div class="brand" id="brand">
      <div class="logoMark">
        <img src="assets/logo.png" alt="Viewora" class="logoImg"
             onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <div class="logoFallback" style="display:none" aria-hidden="true">V</div>
      </div>

      <h1 class="wordmark" aria-label="Viewora">
        <span class="letter">V</span>
        <span class="letter">i</span>
        <span class="letter">e</span>
        <span class="letter">w</span>
        <span class="letter oWrap">
          <span class="oLetter">o</span>
          <span class="universe" aria-hidden="true">
            <span class="ring ring1"></span>
            <span class="ring ring2"></span>
            <span class="ring ring3"></span>
            <span class="core"></span>
            <span class="spark s1"></span>
            <span class="spark s2"></span>
            <span class="spark s3"></span>
            <span class="spark s4"></span>
          </span>
        </span>
        <span class="letter">r</span>
        <span class="letter">a</span>
      </h1>

      <p class="tagline">See the universe</p>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
