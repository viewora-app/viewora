<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Viewora</title>
  <link rel="icon" href="icon-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .logo{width:88px;height:88px;object-fit:contain;border-radius:22px;opacity:0;animation:in .4s ease .05s forwards}
    @keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <img class="logo" src="icon-192.png" alt="" onerror="this.onerror=null;this.src='assets/logo.png'">
  <script>
  (function () {
    var KEY = "viewora_splash_done";
    var REDIR = "viewora_splash_redirecting";
    try {
      // Mark done immediately so no second splash in this session
      sessionStorage.setItem(KEY, "1");
      sessionStorage.removeItem(REDIR);
    } catch (e) {}

    var next = "index.html";
    try {
      var p = new URLSearchParams(location.search);
      var n = p.get("next");
      if (n && !/^https?:/i.test(n) && n.indexOf("//") === -1) {
        next = n;
      }
    } catch (e) {}

    // Single navigation only
    var gone = false;
    function go() {
      if (gone) return;
      gone = true;
      try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      location.replace(next);
    }
    setTimeout(go, 900);
  })();
  </script>
  <script src="crash-guard.js"></script>
</body>
</html>
