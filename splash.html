<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Viewora PWA / TWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viewora">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="pwa-register.js" defer></script>


  <meta name="theme-color" content="#000000">
  <title>Viewora</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .logo{width:72px;height:72px;object-fit:contain;border-radius:18px;opacity:0;animation:in .45s ease .05s forwards}
    @keyframes in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="Viewora" onerror="this.style.display='none'">
  <script>
  (function(){
    try {
      sessionStorage.setItem("viewora_splash_done","1");
      sessionStorage.removeItem("viewora_splash_redirecting");
    } catch(e){}
    var next="index.html";
    try {
      var p=new URLSearchParams(location.search);
      if(p.get("next")) next=p.get("next");
    } catch(e){}
    setTimeout(function(){ location.replace(next); }, 1100);
  })();
  </script>
</body>
</html>
