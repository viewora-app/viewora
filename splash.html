<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viewora">
  <title>Viewora</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{
      height:100%;background:#000;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      overflow:hidden;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    .splash-wrap{
      display:flex;flex-direction:column;align-items:center;gap:18px;
      opacity:0;animation:fadeIn .4s ease .05s forwards;
    }
    .logo{
      width:108px;height:108px;object-fit:contain;
      border-radius:28px; /* curved / squircle */
      box-shadow:0 12px 48px rgba(124,58,237,.35);
      background:#111;
    }
    .brand{
      color:#fff;font-size:22px;font-weight:700;
      letter-spacing:.02em;opacity:.95;
    }
    @keyframes fadeIn{
      from{opacity:0;transform:scale(.92)}
      to{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <div class="splash-wrap">
    <img class="logo" src="icon-192.png" alt="Viewora"
         onerror="this.onerror=null;this.src='assets/logo.png'">
    <div class="brand">Viewora</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script>
  (function () {
    var DONE = "viewora_splash_done";
    var LOCK = "viewora_splash_lock";

    if (window.__vieworaSplashRan) return;
    window.__vieworaSplashRan = true;

    try {
      sessionStorage.setItem(DONE, "1");
      sessionStorage.setItem(LOCK, "1");
    } catch (e) {}

    function safeNext(n) {
      if (!n) return null;
      n = String(n);
      if (/^https?:/i.test(n) || n.indexOf("//") !== -1) return null;
      if (/\.\./.test(n)) return null;
      if (/splash\.html/i.test(n)) return null;
      return n;
    }

    function hasSavedAccounts() {
      try {
        var a = JSON.parse(localStorage.getItem("viewora_saved_accounts") || "[]");
        return Array.isArray(a) && a.length > 0;
      } catch (e) {
        return false;
      }
    }

    function targetForUser(user) {
      try {
        var p = new URLSearchParams(location.search);
        var n = safeNext(p.get("next"));
        if (n) return n;
      } catch (e) {}
      if (user) return "index.html";
      if (hasSavedAccounts()) return "login.html";
      return "signup.html";
    }

    var gone = false;
    function go(url) {
      if (gone) return;
      gone = true;
      try { location.replace(url || "index.html"); } catch (e) {
        location.href = url || "index.html";
      }
    }

    var minMs = 900;
    var start = Date.now();
    function finish(user) {
      var wait = Math.max(0, minMs - (Date.now() - start));
      setTimeout(function () { go(targetForUser(user)); }, wait);
    }

    function withAuth() {
      try {
        if (typeof firebase === "undefined" || !firebase.auth) {
          finish(null);
          return;
        }
        var unsub = firebase.auth().onAuthStateChanged(function (user) {
          try { unsub && unsub(); } catch (e) {}
          finish(user);
        });
        setTimeout(function () {
          try { unsub && unsub(); } catch (e) {}
          finish(null);
        }, 2500);
      } catch (e) {
        finish(null);
      }
    }

    withAuth();
  })();
  </script>
</body>
</html>
