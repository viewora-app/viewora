<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("viewora_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Viewora • Story</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="story-upload.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="media-perf.css">
</head>
<body class="storyBody">
<div id="app" class="storyApp">

  <!-- PICK -->
  <section id="pickScreen" class="pickScreen">
    <header class="pickTop">
      <button type="button" id="pickBackBtn" class="iconBtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <strong>Add to Story</strong>
      <span class="spacer"></span>
    </header>
    <div class="pickBody">
      <div class="pickHero">
        <div class="pickIcon"><i class="fa-solid fa-camera"></i></div>
        <h1>Create a Story</h1>
        <p>Photo or video · lasts 24 hours</p>
      </div>
      <div class="pickActions">
        <button type="button" id="pickGalleryBtn" class="pickCard">
          <span class="pickCardIcon"><i class="fa-regular fa-images"></i></span>
          <span class="pickCardText"><strong>Gallery</strong><small>Photo or video</small></span>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" id="pickCameraBtn" class="pickCard">
          <span class="pickCardIcon"><i class="fa-solid fa-camera"></i></span>
          <span class="pickCardText"><strong>Camera</strong><small>Take a photo</small></span>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button type="button" id="storyGoLiveBtn" class="pickCard pickCardLive">
          <span class="pickCardIcon liveIcon"><i class="fa-solid fa-tower-broadcast"></i></span>
          <span class="pickCardText"><strong>Go Live</strong><small>Vertical 9:16</small></span>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" hidden>
  </section>

  <!-- EDITOR (WhatsApp style) -->
  <section id="editorScreen" class="editorScreen hidden">
    <header class="waTop">
      <button type="button" id="editorBackBtn" class="waIcon" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <div class="waTopTools">
        <button type="button" class="waIcon toolBtn" data-tool="music" title="Music"><i class="fa-solid fa-music"></i></button>
        <button type="button" class="waIcon" id="cropToolBtn" title="Crop"><i class="fa-solid fa-crop-simple"></i></button>
        <button type="button" class="waIcon toolBtn" data-tool="sticker" title="Sticker"><i class="fa-regular fa-face-smile"></i></button>
        <button type="button" class="waIcon toolBtn" data-tool="text" title="Text"><i class="fa-solid fa-font"></i></button>
        <button type="button" class="waIcon" id="drawToolBtn" title="Draw"><i class="fa-solid fa-pen"></i></button>
        <button type="button" class="waIcon toolBtn" data-tool="filter" title="Filter"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
      </div>
      <button type="button" id="editorDoneBtn" class="waDone">Done</button>
    </header>

    <div id="stage" class="stage">
      <div id="mediaWrap" class="mediaWrap">
        <img id="previewImage" class="previewMedia hidden" alt="">
        <video id="previewVideo" class="previewMedia hidden" playsinline muted loop></video>
        <div id="filterOverlay" class="filterOverlay"></div>
        <canvas id="drawCanvas" class="drawCanvas"></canvas>
      </div>
      <div id="textLayer" class="textLayer"></div>
      <div id="stickerLayer" class="stickerLayer"></div>
      <div id="musicBadge" class="musicBadge hidden">
        <i class="fa-solid fa-music"></i>
        <span id="musicBadgeText">Original audio</span>
      </div>
      <div id="storyOwnerCredit" class="ownerCredit hidden"></div>
    </div>

    <!-- Draw toolbar -->
    <div id="drawBar" class="drawBar hidden">
      <div class="drawColors" id="drawColors">
        <button type="button" class="dColor active" data-color="#25d366" style="background:#25d366"></button>
        <button type="button" class="dColor" data-color="#ffffff" style="background:#fff"></button>
        <button type="button" class="dColor" data-color="#ff3b5f" style="background:#ff3b5f"></button>
        <button type="button" class="dColor" data-color="#ffd60a" style="background:#ffd60a"></button>
        <button type="button" class="dColor" data-color="#0a84ff" style="background:#0a84ff"></button>
        <button type="button" class="dColor" data-color="#bf5af2" style="background:#bf5af2"></button>
        <button type="button" class="dColor" data-color="#000000" style="background:#111;border:1px solid #444"></button>
      </div>
      <input type="range" id="drawSize" min="2" max="28" value="6">
      <button type="button" id="drawUndo" class="waIcon"><i class="fa-solid fa-rotate-left"></i></button>
      <button type="button" id="drawClear" class="waIcon"><i class="fa-solid fa-trash"></i></button>
      <button type="button" id="drawDone" class="waDone sm">OK</button>
    </div>

    <!-- Crop toolbar -->
    <div id="cropBar" class="cropBar hidden">
      <button type="button" id="cropRotate" class="waIcon"><i class="fa-solid fa-rotate-right"></i></button>
      <button type="button" id="cropReset" class="ghostBtn">Reset</button>
      <button type="button" id="cropDone" class="waDone sm">Done</button>
    </div>

    <!-- Bottom WhatsApp-style share -->
    <footer class="waFooter">
      <div class="privacyRow">
        <button type="button" class="privacyChip active" data-privacy="followers" id="privacyFollowers">
          <i class="fa-solid fa-earth-asia"></i> My status
        </button>
        <button type="button" class="privacyChip" data-privacy="close_friends" id="privacyClose">
          <i class="fa-solid fa-star"></i> Close friends
        </button>
      </div>
      <div class="waShareRow">
        <div class="shareMeta">
          <img id="shareAvatar" src="assets/default-avatar.png" alt="" class="shareAvatar">
          <div>
            <strong id="shareName">Your Story</strong>
            <small id="privacyLabel">Visible to followers · 24h</small>
          </div>
        </div>
        <button type="button" id="shareStoryBtn" class="waShareBtn">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Share story</span>
        </button>
      </div>
    </footer>
  </section>

  <!-- TEXT -->
  <div id="textPanel" class="sheet hidden" aria-hidden="true">
    <div class="sheetBackdrop" data-close="textPanel"></div>
    <div class="sheetCard">
      <div class="sheetHandle"></div>
      <header class="sheetHead"><strong>Text</strong>
        <button type="button" class="sheetClose" data-close="textPanel"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <textarea id="textInput" maxlength="120" placeholder="Type something..." rows="3"></textarea>
      <div class="colorRow" id="textColors">
        <button type="button" class="colorDot active" data-color="#ffffff" style="background:#fff"></button>
        <button type="button" class="colorDot" data-color="#000000" style="background:#111"></button>
        <button type="button" class="colorDot" data-color="#25d366" style="background:#25d366"></button>
        <button type="button" class="colorDot" data-color="#ff3b5f" style="background:#ff3b5f"></button>
        <button type="button" class="colorDot" data-color="#ffd60a" style="background:#ffd60a"></button>
        <button type="button" class="colorDot" data-color="#0a84ff" style="background:#0a84ff"></button>
        <button type="button" class="colorDot" data-color="#bf5af2" style="background:#bf5af2"></button>
      </div>
      <div class="styleRow">
        <button type="button" class="styleChip active" data-style="classic">Classic</button>
        <button type="button" class="styleChip" data-style="bold">Bold</button>
        <button type="button" class="styleChip" data-style="neon">Neon</button>
        <button type="button" class="styleChip" data-style="type">Type</button>
      </div>
      <button type="button" id="addTextBtn" class="primaryBtn waGreen">Add text</button>
    </div>
  </div>

  <!-- STICKER -->
  <div id="stickerPanel" class="sheet hidden" aria-hidden="true">
    <div class="sheetBackdrop" data-close="stickerPanel"></div>
    <div class="sheetCard">
      <div class="sheetHandle"></div>
      <header class="sheetHead"><strong>Stickers</strong>
        <button type="button" class="sheetClose" data-close="stickerPanel"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div id="stickerGrid" class="stickerGrid"></div>
    </div>
  </div>

  <!-- FILTER -->
  <div id="filterPanel" class="sheet hidden" aria-hidden="true">
    <div class="sheetBackdrop" data-close="filterPanel"></div>
    <div class="sheetCard">
      <div class="sheetHandle"></div>
      <header class="sheetHead"><strong>Filters</strong>
        <button type="button" class="sheetClose" data-close="filterPanel"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div id="filterRow" class="filterRow"></div>
    </div>
  </div>

  <!-- MUSIC (WhatsApp style) -->
  <div id="musicPanel" class="sheet hidden" aria-hidden="true">
    <div class="sheetBackdrop" data-close="musicPanel"></div>
    <div class="sheetCard musicSheet">
      <div class="sheetHandle"></div>
      <header class="sheetHead">
        <strong>Music</strong>
        <button type="button" class="sheetClose" data-close="musicPanel"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="musicSearchWrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="musicSearch" placeholder="Search songs" autocomplete="off">
      </div>
      <div id="musicList" class="musicList">
        <button type="button" class="musicRow active" data-music-id="original">
          <span class="musicIcon"><i class="fa-solid fa-music"></i></span>
          <span class="musicMeta"><strong>Original audio</strong><small>No music</small></span>
          <i class="fa-solid fa-check"></i>
        </button>
      </div>
      <div id="musicTrimBox" class="musicTrimBox hidden">
        <div class="musicTrimHead">
          <strong id="musicTrimTitle">Trim · 15s</strong>
          <span id="musicTrimTime">0:00</span>
        </div>
        <input type="range" id="musicTrimSlider" min="0" max="100" step="0.5" value="0">
        <div class="trimWave" id="trimWave"></div>
        <div class="musicTrimActions">
          <button type="button" class="sheetBtn ghost" id="musicTrimPreview"><i class="fa-solid fa-play"></i> Preview</button>
          <button type="button" class="sheetBtn primary waGreen" id="musicTrimDone">Done</button>
        </div>
      </div>
      <button type="button" id="openMusicStoreBtn" class="storeLink"><i class="fa-solid fa-store"></i> Open Music Store</button>
    </div>
  </div>

  <div id="uploadOverlay" class="uploadOverlay hidden">
    <div class="uploadCard">
      <div class="uploadRing">
        <svg viewBox="0 0 80 80">
          <circle class="ringTrack" cx="40" cy="40" r="34"></circle>
          <circle id="uploadRingProgress" class="ringProgress" cx="40" cy="40" r="34"></circle>
        </svg>
        <img id="uploadAvatar" src="assets/default-avatar.png" alt="">
      </div>
      <strong id="uploadTitle">Uploading story…</strong>
      <p id="uploadSub">Please wait</p>
      <div class="uploadBar"><span id="uploadBarFill"></span></div>
      <span id="uploadPercent">0%</span>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status">
    <i id="toastIcon" class="fa-solid fa-circle-check"></i>
    <span id="toastText">Done</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="firebase.js"></script>
<script src="media-perf.js"></script>
<script src="media-upload-compress-hook.js"></script>
<script src="upload-queue.js"></script>
<script src="theme.js"></script>
<script src="viewora-stores.js"></script>
<script src="story-upload.js"></script>
<script src="story-layer-gestures.js"></script>
</body>
</html>
