    <!-- Viewora boot: splash once per session -->
    <script>
    (function () {
      try {
        if (/splash\.html/i.test(location.pathname)) return;
        if (sessionStorage.getItem("viewora_splash_seen")) return;
        // mark so we don't loop if replace fails
        if (sessionStorage.getItem("viewora_splash_redirecting") === "1") return;
        sessionStorage.setItem("viewora_splash_redirecting", "1");
        location.replace("splash.html");
      } catch (e) {}
    })();
    </script>

<style>
.vieworaSplash {
  position: fixed; inset: 0; z-index: 999999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #12122a 0%, #050507 70%);
  transition: opacity .45s ease, visibility .45s ease;
}
.vieworaSplash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.vieworaSplashLogo {
  width: min(130px, 30vw); height: min(130px, 30vw);
  object-fit: contain;
  filter: drop-shadow(0 12px 40px rgba(99,102,241,.35));
  animation: vSplashIn .75s ease both;
}
.vieworaSplashWord {
  margin-top: 20px; font-size: clamp(26px, 6.5vw, 38px); font-weight: 800;
  letter-spacing: .04em;
  background: linear-gradient(135deg, #22d3ee, #818cf8, #c084fc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: vSplashIn .75s ease .1s both;
  font-family: Inter, system-ui, sans-serif;
}
@keyframes vSplashIn {
  from { opacity: 0; transform: translateY(10px) scale(.96); }
  to { opacity: 1; transform: none; }
}
</style>
<script>
(function(){
  try {
    if (sessionStorage.getItem("viewora_splash_done") === "1") {
      var el = document.getElementById("vieworaSplash");
      if (el) el.remove();
      return;
    }
  } catch(_){}
  setTimeout(function(){
    var el = document.getElementById("vieworaSplash");
    if (el) el.classList.add("hide");
    try { sessionStorage.setItem("viewora_splash_done", "1"); } catch(_){}
    setTimeout(function(){ if (el && el.parentNode) el.remove(); }, 500);
  }, 3000);
})();
</script>

<!-- PAGE STARTUP + SWIPE LOGIC -->
<script>
(function () {
    "use strict";

    /* ========== PAGE LOADER ========== */
    function startPage() {
        const loader = document.getElementById("pageLoader");
        const app = document.getElementById("app");
        // Always unlock app even if pageLoader is missing
        function reveal() {
            if (app) {
                app.classList.remove("hidden");
                app.classList.add("pageReady");
            }
            document.documentElement.style.overflowY = "auto";
            document.body.style.overflowY = "auto";
            document.body.style.height = "auto";
        }
        if (!app) return;
        if (!loader) {
            reveal();
            return;
        }
        window.setTimeout(function () {
            loader.classList.add("loaderHide");
            window.setTimeout(function () {
                try { loader.remove(); } catch (_) {}
                reveal();
            }, 450);
        }, 400);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startPage, { once: true });
    } else {
        startPage();
    }

    /* ========== SEARCH → full page only (no inline flash) ========== */
    const searchBtn = document.getElementById("searchBtn");
    const searchSection = document.getElementById("searchSection");
    if (searchSection) {
        searchSection.classList.remove("open");
        searchSection.style.display = "none";
    }
    if (searchBtn) {
        searchBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = "search-page.html";
        }, true);
    }

    /* ========== CATEGORY FILTER ========== */
    const categories = document.querySelectorAll(".categoryChip");
    categories.forEach(function (button) {
        button.addEventListener("click", function () {
            categories.forEach(function (item) {
                item.classList.remove("active");
            });
            button.classList.add("active");
            const category = button.dataset.category || "all";
            window.dispatchEvent(new CustomEvent("viewora:category-change", {
                detail: { category: category }
            }));
        });
    });

    /* ========== ESCAPE ========== */
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && searchSection) {
            searchSection.classList.remove("open");
        }
    });

    /* ========== NETWORK ========== */
    function updateNetwork() {
        const status = document.getElementById("networkStatus");
        if (!status) return;
        status.classList.toggle("hidden", navigator.onLine);
    }
    window.addEventListener("online", updateNetwork);
    window.addEventListener("offline", updateNetwork);
    updateNetwork();


    /* ==================================================
       FEED SWITCHER + SWIPE (Long Videos ↔ All Posts)
    ================================================== */
    const swipeFeed   = document.getElementById("swipeFeed");
    const feedTabs    = document.querySelectorAll(".feedTab");
    let currentView   = "videos";   // default

    function switchView(view) {
        currentView = view;

        feedTabs.forEach(tab => {
            tab.classList.toggle("active", tab.dataset.view === view);
        });

        if (!swipeFeed) return;
        if (view === "posts") {
            swipeFeed.classList.add("posts-view");
        } else {
            swipeFeed.classList.remove("posts-view");
        }
        // Hard-toggle panels (no side-by-side leak)
        var panels = swipeFeed.querySelectorAll(".swipePanel");
        if (panels.length >= 2) {
            panels[0].style.display = (view === "posts") ? "none" : "block";
            panels[1].style.display = (view === "posts") ? "block" : "none";
        }
    }

    // Tab click
    feedTabs.forEach(tab => {
        tab.addEventListener("click", function () {
            switchView(this.dataset.view);
        });
    });

    // Initial: Long Videos only (posts hidden until tab click)
    switchView("videos");

    // Touch swipe support
    let startX = 0;
    let startY = 0;
    let isSwiping = false;

    const homeFeed = document.querySelector(".homeFeed");

    if (homeFeed) {
        homeFeed.addEventListener("touchstart", function (e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
        }, { passive: true });

        homeFeed.addEventListener("touchmove", function (e) {
            if (!isSwiping) return;
            // prevent vertical scroll interference if horizontal
        }, { passive: true });

        homeFeed.addEventListener("touchend", function (e) {
            if (!isSwiping) return;
            isSwiping = false;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = endX - startX;
            const diffY = endY - startY;

            // Only horizontal swipe (ignore vertical scrolls)
            if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < 0 && currentView === "videos") {
                    // Swipe left → All Posts
                    switchView("posts");
                } else if (diffX > 0 && currentView === "posts") {
                    // Swipe right → Long Videos
                    switchView("videos");
                }
            }
        }, { passive: true });
    }

})();
</script>

  function goSearch(q) {
    q = (q || "").trim();
    var url = "search-page.html";
    if (q) url += "?q=" + encodeURIComponent(q);
    window.location.href = url;
  }

  function startVoiceSearch(micBtn) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert("Voice search is not supported on this browser. Please type to search.");
      goSearch("");
      return;
    }
    var rec = new SR();
    rec.lang = (navigator.language || "en-IN");
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    if (micBtn) micBtn.classList.add("listening");
    rec.onresult = function (ev) {
      var t = "";
      try {
        t = (ev.results[0][0].transcript || "").trim();
      } catch (_) {}
      if (micBtn) micBtn.classList.remove("listening");
      if (t) goSearch(t);
      else goSearch("");
    };
    rec.onerror = function () {
      if (micBtn) micBtn.classList.remove("listening");
    };
    rec.onend = function () {
      if (micBtn) micBtn.classList.remove("listening");
    };
    try {
      rec.start();
    } catch (e) {
      if (micBtn) micBtn.classList.remove("listening");
      alert("Could not start microphone. Check permission.");
    }
  }

  var openBtn = document.getElementById("headerSearchOpen");
  var micBtn = document.getElementById("homeSearchMic");

  if (openBtn) {
    openBtn.addEventListener("click", function (e) {
      e.preventDefault();
      goSearch(""); // open search page — type there
    });
  }
  if (micBtn) {
    micBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      startVoiceSearch(micBtn);
    });
  }
})();
</script>

</body>
</html>
