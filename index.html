<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#08080d">
    <meta name="description" content="Viewora — Create, Watch, Share & Connect">
    <title>Viewora • Home</title>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- VIEWORA CSS -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nav.css">

    <style>
        /* ========== FEED SWITCHER (Videos ↔ Posts) ========== */
        .feedSwitcher {
            display: flex;
            gap: 8px;
            padding: 12px 16px 8px;
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(180deg, #08080d 70%, transparent);
        }

        .feedTab {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            color: #888;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .feedTab.active {
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 20px rgba(109, 40, 217, 0.35);
        }

        .feedTab i {
            font-size: 15px;
        }

        /* ========== SWIPE CONTAINER ========== */
        .swipeFeed {
            display: flex;
            width: 200%;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: transform;
        }

        .swipeFeed.posts-view {
            transform: translateX(-50%);
        }

        .swipePanel {
            width: 50%;
            flex-shrink: 0;
            padding: 0 0 100px;
        }

        /* Hide original section headers when using switcher */
        .swipePanel .sectionHeader {
            display: none;
        }

        /* Premium empty state */
        .emptyState {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .emptyState i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }
    </style>

    <style id="headerIconsFix">
        .headerActions {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            flex-shrink: 0 !important;
        }
        .headerActions .headerIcon {
            display: grid !important;
            place-items: center !important;
            width: 42px !important;
            height: 42px !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        #messageBtn, #searchBtn, #subscriptionBtn {
            display: grid !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        #messageCount.notificationBadge:not(.hidden) {
            display: grid !important;
        }
    </style>

</head>

<body>
  

<!-- APP -->
<div id="app" class="app hidden">

    <!-- TOP HEADER -->
    <header class="topHeader">
        <a href="index.html" class="brand" aria-label="Viewora Home">
            <img src="viewora2.jpg" alt="Viewora" class="brandLogo">
            <div class="brandText">
                <strong>Viewora</strong>
          
            </div>
        </a>

                        <div class="headerActions">
            <button id="searchBtn" class="headerIcon" type="button" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button id="messageBtn" class="headerIcon" type="button" aria-label="Messages"
                    onclick="location.href='messages.html'">
                <i class="fa-regular fa-paper-plane"></i>
                <span id="messageCount" class="notificationBadge hidden">0</span>
            </button>

            <button id="subscriptionBtn" class="headerIcon" type="button" aria-label="Subscription"
                    onclick="location.href='subscription.html'">
                <i class="fa-solid fa-crown"></i>
            </button>
        </div>


    </header>

    <!-- SEARCH PANEL -->
    <section id="searchSection" class="searchSection">
        <div class="searchBox">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchInput" type="search" placeholder="Search people, videos, posts..." autocomplete="off">
            <button id="clearSearch" class="clearSearch" type="button" aria-label="Clear search">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="searchResults" class="searchResults"></div>
    </section>

    <!-- MAIN HOME -->
    <main class="homeContent">

        <!-- STORIES -->
        <section class="storiesSection">
            <div class="sectionHeader">
                <div>
                    <span class="sectionEyebrow">CONNECT</span>
          
                </div>
                <button id="viewAllStories" class="sectionAction" type="button"
                        onclick="location.href='stories.html'">
                    See all <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div id="storiesContainer" class="storiesContainer">
                <button id="addStoryBtn" class="storyCard yourStory" type="button"
                        onclick="location.href='story-upload.html'">
                    <div class="storyImageWrap">
                        <img id="myStoryAvatar" src="assets/default-avatar.png" alt="Your Story" class="storyImage">
                        <span class="yourStoryPlus"><i class="fa-solid fa-plus"></i></span>
                    </div>
                    <span class="storyName">Your Story</span>
                </button>
                <div id="firebaseStories" class="firebaseStories"></div>
            </div>
        </section>

        <!-- CATEGORY BAR -->
        <section class="categorySection">
            <div id="categoryScroller" class="categoryScroller">
                <button class="categoryChip active" data-category="all" type="button">
                    <i class="fa-solid fa-layer-group"></i> All
                </button>
                <button class="categoryChip" data-category="gaming" type="button">
                    <i class="fa-solid fa-gamepad"></i> Gaming
                </button>
                <button class="categoryChip" data-category="tech" type="button">
                    <i class="fa-solid fa-microchip"></i> Tech
                </button>
                <button class="categoryChip" data-category="music" type="button">
                    <i class="fa-solid fa-music"></i> Music
                </button>
                <button class="categoryChip" data-category="news" type="button">
                    <i class="fa-regular fa-newspaper"></i> News
                </button>
                <button class="categoryChip" data-category="sports" type="button">
                    <i class="fa-solid fa-trophy"></i> Sports
                </button>
                <button class="categoryChip" data-category="education" type="button">
                    <i class="fa-solid fa-graduation-cap"></i> Education
                </button>
                <button class="categoryChip" data-category="entertainment" type="button">
                    <i class="fa-solid fa-film"></i> Entertainment
                </button>
                <button class="categoryChip" data-category="lifestyle" type="button">
                    <i class="fa-solid fa-heart"></i> Lifestyle
                </button>
            </div>
        </section>

        <!-- ========== FEED SWITCHER (Long Videos ↔ All Posts) ========== -->
        <div class="feedSwitcher">
            <button class="feedTab active" data-view="videos" type="button">
                <i class="fa-solid fa-play-circle"></i>
                Long Videos
            </button>
            <button class="feedTab" data-view="posts" type="button">
                <i class="fa-solid fa-images"></i>
                All Posts
            </button>
        </div>

        <!-- ========== SWIPEABLE FEED ========== -->
        <div class="homeFeed">
            <div id="swipeFeed" class="swipeFeed">

                <!-- PANEL 1: LONG VIDEOS (Default) -->
                <div class="swipePanel" id="videosPanel">
                    <section class="contentSection premiumSection" id="longVideosSection">
                        <div class="sectionHeader">
                            <div>
                                <span class="sectionEyebrow">WATCH</span>
                                <h2>Long Videos</h2>
                            </div>
                        </div>

                        <div id="longVideoContainer" class="longVideoContainer"></div>

                        <!-- Skeleton -->
                        <div id="videoSkeleton" class="videoSkeleton">
                            <article class="videoSkeletonCard">
                                <div class="skeletonMedia shimmer"></div>
                                <div class="skeletonText shimmer"></div>
                            </article>
                            <article class="videoSkeletonCard">
                                <div class="skeletonMedia shimmer"></div>
                                <div class="skeletonText shimmer"></div>
                            </article>
                        </div>
                    </section>
                </div>

                <!-- PANEL 2: ALL POSTS (Swipe left to see) -->
                <div class="swipePanel" id="postsPanel">
                    <section class="contentSection postsSection premiumSection" id="postsSection">
                        <div class="sectionHeader">
                            <div>
                                <span class="sectionEyebrow">EXPLORE</span>
                                <h2>All Posts</h2>
                            </div>
                        </div>

                        <div id="feedContainer" class="feedContainer"></div>

                        <!-- Skeleton -->
                        <div id="feedSkeleton" class="feedSkeleton">
                            <article class="postSkeleton">
                                <div class="skeletonPostHeader">
                                    <div class="skeletonAvatar shimmer"></div>
                                    <div class="skeletonUser">
                                        <div class="skeletonLine shimmer"></div>
                                        <div class="skeletonSmall shimmer"></div>
                                    </div>
                                </div>
                                <div class="skeletonMedia shimmer"></div>
                                <div class="skeletonLine wide shimmer"></div>
                                <div class="skeletonLine medium shimmer"></div>
                            </article>
                            <article class="postSkeleton">
                                <div class="skeletonPostHeader">
                                    <div class="skeletonAvatar shimmer"></div>
                                    <div class="skeletonUser">
                                        <div class="skeletonLine shimmer"></div>
                                        <div class="skeletonSmall shimmer"></div>
                                    </div>
                                </div>
                                <div class="skeletonMedia shimmer"></div>
                            </article>
                        </div>
                    </section>
                </div>

            </div>
        </div>

    </main>

    <!-- GLOBAL LOADING -->
    <div id="loadingOverlay" class="loadingOverlay hidden">
        <div class="premiumLoading">
            <div class="loadingLogo">
                <img src="viewora2.jpg" alt="Viewora">
            </div>
            <div class="loadingOrbit"></div>
        </div>
        <strong id="loadingText">Loading...</strong>
        <span>Please wait</span>
    </div>

    <!-- IMAGE VIEWER -->
    <div id="imageViewer" class="mediaViewer hidden">
        <button id="closeViewer" class="viewerClose" type="button" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="viewerImage" src="" alt="Viewora image">
    </div>

    <!-- VIDEO VIEWER -->
    <div id="videoViewer" class="mediaViewer hidden">
        <button id="closeVideo" class="viewerClose" type="button" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <video id="viewerVideo" controls playsinline></video>
    </div>

    <!-- STORY VIEWER -->
    <div id="storyViewer" class="storyViewer hidden">
        <div id="storyProgress" class="storyProgress"></div>
        <button id="closeStory" class="viewerClose" type="button" aria-label="Close Story">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="storyViewerContent">
            <img id="storyImage" alt="Story" hidden>
            <video id="storyVideo" playsinline hidden></video>
        </div>
        <div class="storyReplyBar">
            <input id="storyReply" type="text" placeholder="Reply to story..." maxlength="300" autocomplete="off">
            <button id="sendStoryReply" type="button" aria-label="Send reply">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
        <span id="toastText">Done</span>
    </div>

    <!-- NETWORK STATUS -->
    <div id="networkStatus" class="networkStatus hidden">
        <i class="fa-solid fa-wifi"></i>
        <span>You're offline</span>
    </div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<!-- VIEWORA CORE -->
<script src="firebase.js"></script>
<script src="index.js"></script>
<script src="call-listener.js"></script>
<script src="notification.js"></script>
<script src="chat.js"></script>
<script src="profile.js"></script>
<script src="nav.js"></script>


<!-- PAGE STARTUP + SWIPE LOGIC -->
<script>
(function () {
    "use strict";

    /* ========== PAGE LOADER ========== */
    function startPage() {
        const loader = document.getElementById("pageLoader");
        const app = document.getElementById("app");
        if (!loader || !app) return;

        window.setTimeout(function () {
            loader.classList.add("loaderHide");
            window.setTimeout(function () {
                loader.remove();
                app.classList.remove("hidden");
                app.classList.add("pageReady");
            }, 450);
        }, 750);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startPage, { once: true });
    } else {
        startPage();
    }

    /* ========== SEARCH ========== */
    const searchBtn = document.getElementById("searchBtn");
    const searchSection = document.getElementById("searchSection");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");

    if (searchBtn && searchSection) {
        searchBtn.addEventListener("click", function () {
            searchSection.classList.toggle("open");
            if (searchSection.classList.contains("open") && searchInput) {
                setTimeout(function () { searchInput.focus(); }, 150);
            }
        });
    }

    if (searchInput && clearSearch) {
        searchInput.addEventListener("input", function () {
            clearSearch.classList.toggle("visible", searchInput.value.trim().length > 0);
        });

        clearSearch.addEventListener("click", function () {
            searchInput.value = "";
            clearSearch.classList.remove("visible");
            searchInput.dispatchEvent(new Event("input", { bubbles: true }));
            searchInput.focus();
        });
    }

    /* ========== CATEGORY FILTER ========== */
    const categories = document.querySelectorAll(".categoryChip");
    categories.forEach(function (button) {
        button.addEventListener("click", function () {
            categories.forEach(function (item) {
                item.classList.remove("active");
            });
            button.classList.add("active");
            const category = button.dataset.category || "all";
            window.dispatchEvent(new CustomEvent("viewora:category-change", {
                detail: { category: category }
            }));
        });
    });

    /* ========== ESCAPE ========== */
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && searchSection) {
            searchSection.classList.remove("open");
        }
    });

    /* ========== NETWORK ========== */
    function updateNetwork() {
        const status = document.getElementById("networkStatus");
        if (!status) return;
        status.classList.toggle("hidden", navigator.onLine);
    }
    window.addEventListener("online", updateNetwork);
    window.addEventListener("offline", updateNetwork);
    updateNetwork();


    /* ==================================================
       FEED SWITCHER + SWIPE (Long Videos ↔ All Posts)
    ================================================== */
    const swipeFeed   = document.getElementById("swipeFeed");
    const feedTabs    = document.querySelectorAll(".feedTab");
    let currentView   = "videos";   // default

    function switchView(view) {
        currentView = view;

        // Update tabs
        feedTabs.forEach(tab => {
            tab.classList.toggle("active", tab.dataset.view === view);
        });

        // Move panels
        if (view === "posts") {
            swipeFeed.classList.add("posts-view");
        } else {
            swipeFeed.classList.remove("posts-view");
        }
    }

    // Tab click
    feedTabs.forEach(tab => {
        tab.addEventListener("click", function () {
            switchView(this.dataset.view);
        });
    });

    // Touch swipe support
    let startX = 0;
    let startY = 0;
    let isSwiping = false;

    const homeFeed = document.querySelector(".homeFeed");

    if (homeFeed) {
        homeFeed.addEventListener("touchstart", function (e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
        }, { passive: true });

        homeFeed.addEventListener("touchmove", function (e) {
            if (!isSwiping) return;
            // prevent vertical scroll interference if horizontal
        }, { passive: true });

        homeFeed.addEventListener("touchend", function (e) {
            if (!isSwiping) return;
            isSwiping = false;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = endX - startX;
            const diffY = endY - startY;

            // Only horizontal swipe (ignore vertical scrolls)
            if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < 0 && currentView === "videos") {
                    // Swipe left → All Posts
                    switchView("posts");
                } else if (diffX > 0 && currentView === "posts") {
                    // Swipe right → Long Videos
                    switchView("videos");
                }
            }
        }, { passive: true });
    }

})();
</script>

</body>
</html>
