<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#08080d">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Viewora">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="pwa-register.js" defer></script>
  <title>Viewora • Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="login.css?v=4">
<style>@keyframes loginShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.loginShake{animation:loginShake .4s ease}</style>
</head>
<body>
  <div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

  <main class="loginPage">
    <div class="brand">
      <img src="icon-192.png" alt="Viewora" class="logo" onerror="this.src='assets/logo.png'">
      <h1>Welcome back</h1>
      <p>Sign in to Viewora</p>
    </div>

    <form id="loginForm" class="card" autocomplete="on" novalidate>
      <label class="field">
        <span>Email or username</span>
        <div class="inputWrap">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="loginId" name="username" placeholder="email@example.com or username"
            autocomplete="username" required>
        </div>
      </label>

      <label class="field">
        <span class="rowBetween">
          <span>Password</span>
          <button type="button" class="linkBtn" id="forgotBtn">Forgot password?</button>
        </span>
        <div class="inputWrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Enter password"
            autocomplete="current-password" required minlength="6">
          <button type="button" class="eyeBtn" id="togglePassword" aria-label="Show password">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </label>

      <label class="remember">
        <input type="checkbox" id="rememberMe" checked>
        <span>Remember this account on this device</span>
      </label>

      <button type="submit" class="primaryBtn" id="loginBtn">
        <span id="loginBtnText">Log in</span>
        <i class="fa-solid fa-spinner fa-spin hidden" id="loginSpinner"></i>
      </button>

      <p class="errorMsg hidden" id="errorMsg" role="alert"></p>
    </form>

    <p class="switch">
      New to Viewora?
      <a href="signup.html">Create account</a>
    </p>

    <p class="legal">
      <a href="terms.html">Terms</a> ·
      <a href="privacy.html">Privacy</a> ·
      <a href="guidelines.html">Guidelines</a>
    </p>
  </main>

  <!-- Forgot password sheet -->
  <div class="modal hidden" id="forgotModal" aria-hidden="true">
    <div class="modalBackdrop" id="forgotBackdrop"></div>
    <div class="modalSheet">
      <h2>Reset password</h2>
      <p class="muted">We’ll email you a reset link.</p>
      <div class="inputWrap">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="forgotEmail" placeholder="Your email" autocomplete="email">
      </div>
      <button type="button" class="primaryBtn" id="forgotSend">Send reset link</button>
      <button type="button" class="ghostBtn" id="forgotClose">Cancel</button>
      <p class="errorMsg hidden" id="forgotError"></p>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="crash-guard.js"></script>
  <script src="account-session.js"></script>
  <script src="beta-banner.js"></script>
  <script src="login.js?v=4"></script>
</body>
</html>
