<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("viewora_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050510" />
  <title>Viewora • Edit Shorts</title>
  <link rel="icon" href="assets/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="edit-shorts.css" />
</head>
<body>
  <header class="top">
    <button type="button" class="iconBtn" id="backBtn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <h1 id="pageTitle">Edit Shorts</h1>
    <button type="button" class="saveBtn" id="saveBtn" disabled>Save</button>
  </header>

  <div class="wrap" id="editorWrap" style="display:none">
    <p class="status" id="statusText">Loading…</p>

    <div class="card">
      <h2>Preview</h2>
      <div class="preview" id="previewBox">
        <video id="previewVideo" playsinline controls style="display:none"></video>
        <img id="previewThumb" alt="" style="display:none" />
        <div class="ph" id="previewPh">No media</div>
      </div>
      <p class="hint">Media replace nahi hoga — sirf title, description, cover &amp; settings.</p>
    </div>

    <div class="card">
      <h2>Details</h2>
      <label class="field">
        <span>Title</span>
        <input id="titleInput" type="text" maxlength="100" placeholder="Short title" />
        <p class="hint"><span id="titleCount">0</span>/100</p>
      </label>
      <label class="field">
        <span>Description</span>
        <textarea id="descInput" maxlength="500" placeholder="Write a caption…"></textarea>
        <p class="hint"><span id="descCount">0</span>/500</p>
      </label>
      <label class="field">
        <span>Hashtags (space separated)</span>
        <input id="tagsInput" type="text" maxlength="200" placeholder="#viewora #shorts" />
      </label>
    </div>

    <div class="card">
      <h2>Cover</h2>
      <label class="field">
        <span>Thumbnail URL (optional)</span>
        <input id="thumbInput" type="text" maxlength="500" placeholder="https://…" />
      </label>
      <p class="hint">Empty chhodo to existing cover rahegi.</p>
    </div>

    <div class="card">
      <h2>Settings</h2>
      <div class="row">
        <label class="field">
          <span>Audience</span>
          <select id="audienceSelect">
            <option value="public">Public</option>
            <option value="followers">Followers</option>
            <option value="private">Only me</option>
          </select>
        </label>
        <label class="field">
          <span>Comments</span>
          <select id="commentsSelect">
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <div class="loginGate" id="loginGate">
    <div>
      <p style="font-size:16px;font-weight:700;margin-bottom:6px">Login required</p>
      <p style="color:var(--muted);font-size:14px">Edit short ke liye sign in karo.</p>
      <a href="login.html">Sign in</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="edit-shorts.js"></script>
</body>
</html>
